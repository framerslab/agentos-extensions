name: Document parser image

# Builds the document parser's container image (registry/curated/tools/document-parser/Dockerfile) and runs its
# lifecycle test in Docker Compose (image/lifecycle.sh): the parser with no network, a read-only root, uid and gid 1000
# and the spool's tmpfs volume, and a client container from the same image that reads a text, Markdown, PDF and Word
# file through it and checks its refusals. A pull request that touches the pack, pnpm-lock.yaml, from which the image
# takes every package it installs (image/manifests.mjs), or the root package.json, whose packageManager names the pnpm
# release that installs them, runs the build and the test once it is ready for review, so a lockfile change such as the
# weekly bump, or a new pnpm release, is tested in the image before it merges; a draft waits. A push to master that
# touches the pack also pushes the image it tested to GHCR, tagged with the commit:
#   ghcr.io/framerslab/agentos-document-parser:sha-<commit>, for every such push.
# The version's tag, ghcr.io/framerslab/agentos-document-parser:<version>, is written by the release workflow's images
# step (release.yml, node scripts/release-plan.mjs images) once the pack's version is released from a commit this
# workflow built: it copies that commit's :sha- manifest, with no rebuild. A version's tag already on GHCR is never
# moved, so a host that pins a release keeps the image that release built. So this workflow reads no version from the
# pack's package.json, whose version on master is not the released one.
# The build and the test hold a read-only token; a second job, the only one that can write packages, pushes the image
# they tested.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['registry/curated/tools/document-parser/**', '.github/workflows/document-parser-image.yml', 'pnpm-lock.yaml', 'package.json']
  push:
    branches: [master]
    paths: ['registry/curated/tools/document-parser/**']
  workflow_dispatch: {}

# A newer push to a pull request cancels the run of the commit it replaces. Every
# other run keys a group of its own, its run id, so it never waits behind another run
# and nothing cancels it: a push to master, which pushes the image, and a manual run.
# A re-run keys its own group too, so re-running an older commit's run never cancels
# the newest one.
concurrency:
  group: document-parser-image-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: The image and its lifecycle test
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Build the image
        run: |
          docker build -f registry/curated/tools/document-parser/Dockerfile -t agentos-document-parser:test \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Run the lifecycle test
        run: bash registry/curated/tools/document-parser/image/lifecycle.sh
      # The push job below takes the image this job tested; this job builds and runs the branch's code, so it holds no
      # write permission.
      - name: Save the tested image for the push
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: docker save agentos-document-parser:test -o "$RUNNER_TEMP/agentos-document-parser.tar"
      - name: Upload the tested image
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with: { name: document-parser-image, path: '${{ runner.temp }}/agentos-document-parser.tar', retention-days: 1, if-no-files-found: error }

  # The only job that can write to GHCR: it loads the image the test ran against and pushes it, and runs no code of the
  # branch or of its dependencies. A manual run on another branch builds and tests and pushes nothing.
  push:
    name: Push the tested image to GHCR
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Pushes take their turn one at a time and none is cancelled, so every tested commit's image reaches GHCR.
    concurrency:
      group: document-parser-image-push
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@v4
        with: { name: document-parser-image, path: '${{ runner.temp }}/image' }
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # The commit's tag alone: the release workflow's images step copies it to the version's tag once the pack's
      # version is released from this commit.
      - name: Push the image
        run: |
          set -euo pipefail
          image=ghcr.io/framerslab/agentos-document-parser
          commit_tag="sha-${GITHUB_SHA::7}"
          docker load -i "$RUNNER_TEMP/image/agentos-document-parser.tar"
          docker tag agentos-document-parser:test "$image:$commit_tag"
          docker push "$image:$commit_tag"
          pushed=("$image:$commit_tag")
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$commit_tag")
          echo "$digest"
          {
            echo "### The document parser's image"
            echo
            for tag in "${pushed[@]}"; do echo "- \`$tag\`"; done
            echo "- digest \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
