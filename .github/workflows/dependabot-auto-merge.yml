name: Dependabot Auto-Merge

# Merges a Dependabot pull request for an npm minor or patch update once CI's
# build check and the Links check have succeeded on its head commit and no other
# workflow check there is pending or failed. master has no required checks, so
# GitHub's own auto-merge (gh pr merge --auto) would merge at once, before CI.
# This workflow runs instead when a pull request workflow finishes, from the
# default branch's copy of this file, and merges only the commit CI tested.
# scripts/dependabot-merge-lib.mjs holds the decision; its tests run in CI.
#
# The merge is made with GITHUB_TOKEN, so it starts no workflow on master. A
# dependency bump carries no changeset, so release.yml would publish nothing.
on:
  workflow_run:
    # The pull request workflows. Extension Validation never runs on a pack's path (#58 removes it).
    workflows: [CI, Links]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  # Two workflows can finish together; the second run then finds the pull request merged.
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # npm updates only: the workflows pin each action to a major tag (actions/checkout@v7), so
  # every GitHub Actions update is a major one, which a maintainer merges.
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    steps:
      # The default branch's scripts/, for the decision. Nothing from the pull request runs.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Merge a green minor or patch update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          d=$(mktemp -d)

          gh api "repos/$REPO/commits/$HEAD_SHA/pulls" > "$d/pulls.json"
          pr=$(jq -r --arg sha "$HEAD_SHA" --arg repo "$REPO" '[.[] | select(.state == "open" and .user.login == "dependabot[bot]" and .head.sha == $sha and .head.repo.full_name == $repo)][0].number // empty' "$d/pulls.json")
          if [ -z "$pr" ]; then
            echo "No open Dependabot pull request has head $HEAD_SHA."
            exit 0
          fi

          # Every page of each list, so nothing past the first page escapes the decision.
          gh api --paginate "repos/$REPO/pulls/$pr/commits?per_page=100" --jq '.[]' | jq -s . > "$d/commits.json"
          gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message > "$d/message.txt"
          gh api graphql --paginate -F pr="$pr" -f owner="${REPO%/*}" -f name="${REPO#*/}" \
            -f query='query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) { reviewThreads(first: 100, after: $endCursor) { pageInfo { hasNextPage endCursor } nodes { isResolved } } } } }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]' | jq -s . > "$d/threads.json"
          gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[]' | jq -s . > "$d/checks.json"

          decision=$(node scripts/dependabot-merge.mjs "$d" "$REPO" "$HEAD_SHA")
          jq -r .reason <<<"$decision"
          if [ "$(jq -r .merge <<<"$decision")" = true ]; then
            if ! out=$(gh pr merge "$pr" -R "$REPO" --squash --match-head-commit "$HEAD_SHA" 2>&1); then
              # Another update merged after CI ran and touched the same lines (pnpm-lock.yaml).
              # Dependabot rebases a conflicting pull request, and the rebase's CI run comes back here.
              if grep -q "merge conflicts" <<<"$out"; then
                echo "#$pr now conflicts with master; it merges after Dependabot rebases it."
                exit 0
              fi
              echo "$out"
              exit 1
            fi
          fi
