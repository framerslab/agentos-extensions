name: Dependabot Landing

# Labels a Dependabot pull request for an npm minor or patch update "landing",
# and posts one comment for its head commit naming the guards that passed, once
# CI's build check and the Links check have succeeded on that commit, no other
# workflow check there is pending or failed, every commit is Dependabot's, no
# review thread is open, and ten minutes have passed since its head was last
# pushed. It never merges and never arms GitHub's auto-merge. The owner's rule:
# a pull request merges only after its reviews and comments on GitHub are read,
# each one that names a failing input fixed and the rest answered, and its
# threads resolved; a workflow that merges by itself skips that pass. A
# maintainer lands a labelled pull request under that rule.
#
# The label stands for the head it was added on. When a guard fails on a later
# run (a new push, a new thread, a check that did not pass), this workflow takes
# off a label it added; a push takes it off as soon as the new head's CI or Links
# run is requested, and a re-run as soon as it starts. A label a person added,
# took off or put back stays as they set it.
# Major updates, GitHub Actions updates, and a pull request whose head commit
# message names a different version than its title, which a rebase can leave
# from an older update, wait for a maintainer.
#
# GitHub's label and comment calls take no condition, so the step reads the
# head again just before it adds the label and writes nothing if the head
# moved; it reads the head once more just after, and takes the label back off if
# a push came in between. Removing a label takes no condition either, so before
# either removal the step reads the timeline again and leaves the label if a
# person changed it last. A change in the moment between that read and the
# removal is the one the API leaves open; a label a person puts on after the
# removal stays.
#
# It runs when a CI or Links run of a pull request is requested, starts or
# finishes, whatever its result, and every hour for an update whose checks
# finished inside its ten minutes, from the default branch's copy of this file.
# scripts/dependabot-merge-lib.mjs holds the decision and the comment; its tests
# run in CI.
on:
  workflow_run:
    # The pull request workflows. Extension Validation never runs on a pack's path (#58 removes it).
    workflows: [CI, Links]
    # requested: a push's new runs take the label off the head that moved at once. in_progress: so does a
    # re-run as it starts, for which GitHub sends no requested event; its check is newer than the one that
    # passed, so it decides. completed: a head's finished runs decide whether it is labelled.
    types: [requested, in_progress, completed]
  # A head younger than ten minutes when its checks finish waits; no later run
  # would come back to it, so the open updates are decided again every hour.
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  # Labels and comments on pull requests.
  pull-requests: write
  checks: read

jobs:
  # npm updates only: the workflows pin each action to a major tag (actions/checkout@v7), so
  # every GitHub Actions update is a major one, which a maintainer merges. A run as it is requested or
  # starts, and a failed or cancelled one, come here too, so a label comes off a moved, re-run or failing
  # head at once; only a head whose checks all passed is labelled.
  label:
    if: >-
      github.event_name == 'schedule' || (
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/'))
    # Every decision waits its turn in one group, the hourly run's and those CI and Links start alike, so no
    # two decide a pull request at once and each finds the comment and the label the one before it wrote.
    # queue: max holds up to 100 waiting jobs; the default would cancel a waiting job when the next one
    # queued. A run this condition skips, for any other pull request, never waits.
    concurrency:
      group: dependabot-landing
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      # The default branch's scripts/, for the decision. Nothing from the pull request runs.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Label the green minor and patch updates ten minutes after their last push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # LANDING_LABEL in scripts/dependabot-merge-lib.mjs.
          LABEL: landing
        run: |
          set -euo pipefail

          # The heads to decide: the one the CI or Links run was requested for, started on or tested,
          # or on the hourly run the head of every open Dependabot npm update.
          if [ "$EVENT" = schedule ]; then
            heads=$(gh pr list -R "$REPO" --state open --author 'app/dependabot' --limit 100 \
              --json headRefName,headRefOid \
              --jq '.[] | select(.headRefName | startswith("dependabot/npm_and_yarn/")) | .headRefOid')
          else
            heads=$HEAD_SHA
          fi

          # The label is made the first time a run needs it.
          label_ready=false
          ensure_label() {
            local out
            if [ "$label_ready" = true ]; then
              return 0
            fi
            if ! gh api "repos/$REPO/labels/$LABEL" --silent 2>/dev/null; then
              if ! out=$(gh api -X POST "repos/$REPO/labels" -f name="$LABEL" -f color=0e8a16 \
                -f description='Checks and guards passed; lands after the comment pass' 2>&1); then
                # Another run made it between the read and the write.
                if ! grep -q already_exists <<<"$out"; then
                  echo "$out"
                  return 1
                fi
              fi
            fi
            label_ready=true
          }

          # Takes the label off a pull request; a 404 means someone took it off first.
          take_label_off() {
            local out
            if ! out=$(gh api -X DELETE "repos/$REPO/issues/$1/labels/$LABEL" 2>&1); then
              if ! grep -q 'HTTP 404' <<<"$out"; then
                echo "$out"
                return 1
              fi
            fi
          }

          # Reads the pull request's timeline again as the last call before a removal, and sets person_changed
          # to true when a person changed the label last: that label is theirs, and stays as they set it.
          recheck_label() {
            gh api --paginate "repos/$REPO/issues/$1/timeline?per_page=100" --jq '.[]' | jq -s . > "$2/timeline-now.json"
            person_changed=$(node scripts/dependabot-merge.mjs --person-changed-label "$2/timeline-now.json")
          }

          decide() {
            local sha=$1 d pr decision current person_changed
            d=$(mktemp -d)

            gh api "repos/$REPO/commits/$sha/pulls" > "$d/pulls.json"
            pr=$(jq -r --arg sha "$sha" --arg repo "$REPO" '[.[] | select(.state == "open" and .user.login == "dependabot[bot]" and .head.sha == $sha and .head.repo.full_name == $repo)][0].number // empty' "$d/pulls.json")
            if [ -z "$pr" ]; then
              echo "No open Dependabot pull request has head $sha."
              return 0
            fi

            # Every page of each list, so nothing past the first page escapes the decision.
            gh api --paginate "repos/$REPO/pulls/$pr/commits?per_page=100" --jq '.[]' | jq -s . > "$d/commits.json"
            gh api "repos/$REPO/commits/$sha" --jq .commit.message > "$d/message.txt"
            gh api graphql --paginate -F pr="$pr" -f owner="${REPO%/*}" -f name="${REPO#*/}" \
              -f query='query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) { reviewThreads(first: 100, after: $endCursor) { pageInfo { hasNextPage endCursor } nodes { isResolved } } } } }' \
              --jq '.data.repository.pullRequest.reviewThreads.nodes[]' | jq -s . > "$d/threads.json"
            gh api --paginate "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '.check_runs[]' | jq -s . > "$d/checks.json"
            # Read last, just before the decision: the head's last push (the opening and every force
            # push of the branch), the label's changes and this workflow's comments.
            gh api --paginate "repos/$REPO/issues/$pr/timeline?per_page=100" --jq '.[]' | jq -s . > "$d/timeline.json"

            decision=$(node scripts/dependabot-merge.mjs "$d" "$REPO" "$sha")
            jq -r .reason <<<"$decision"

            # A push after the reads above leaves the decision about a head the pull request no longer has,
            # so the head is read again just before the label goes on, and nothing is written if it moved.
            if [ "$(jq -r '.comment != null or .label == "add"' <<<"$decision")" = true ]; then
              if [ "$(jq -r .label <<<"$decision")" = add ]; then
                ensure_label
              fi
              current=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
              if [ "$current" != "$sha" ]; then
                echo "#$pr moved to $current after the read; the runs its checks start decide it."
                return 0
              fi
            fi

            case "$(jq -r '.label // empty' <<<"$decision")" in
              add)
                jq -n --arg label "$LABEL" '{labels: [$label]}' | gh api -X POST "repos/$REPO/issues/$pr/labels" --input - > /dev/null
                # A push in the moment between the read above and this write would leave the label on a
                # commit no check has run on, so the head is read once more, and the label comes back off
                # if it moved, unless a person changed it in that moment.
                current=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
                if [ "$current" != "$sha" ]; then
                  recheck_label "$pr" "$d"
                  if [ "$person_changed" = true ]; then
                    echo "#$pr moved to $current as it was labelled, and a person changed the $LABEL label since; left it as they set it."
                  else
                    take_label_off "$pr"
                    echo "#$pr moved to $current as it was labelled; took the $LABEL label back off, and the runs its checks start decide it."
                  fi
                  return 0
                fi
                echo "#$pr: labelled $LABEL."
                ;;
              remove)
                # The decision read the timeline before it ran, and a person who took the label off or put it
                # back since owns it.
                recheck_label "$pr" "$d"
                if [ "$person_changed" = true ]; then
                  echo "#$pr: a person changed the $LABEL label after the read; left it as they set it."
                else
                  take_label_off "$pr"
                  echo "#$pr: took the $LABEL label off."
                fi
                ;;
            esac

            # After the label, so the comment's word that the pull request carries it is true; a run that
            # stops between the two posts the comment on the next run.
            if [ "$(jq -r '.comment != null' <<<"$decision")" = true ]; then
              jq '{body: .comment}' <<<"$decision" | gh api -X POST "repos/$REPO/issues/$pr/comments" --input - > /dev/null
              echo "#$pr: posted the guards that passed at $sha."
            fi
          }

          # Called plainly, not in an || list, so set -e still stops a run whose API call failed;
          # the next run decides again.
          for sha in $heads; do
            decide "$sha"
          done
