name: Bump @framers/* deps

# Weekly cron + manual trigger. Bumps every @framers/* explicit version pin
# in package.json files to the latest npm-published version, refreshes the
# pnpm lockfile when present, bumps git submodule pointers when present,
# and opens a single Pull Request with the diff. The same workflow drops
# into every repo that depends on the agentos family.
#
# The branch is pushed and the pull request opened with FRAMERS_BUMP_TOKEN, a
# personal token held as a framerslab organization secret, never with
# GITHUB_TOKEN. GitHub holds the pull_request runs of a pull request that
# GITHUB_TOKEN opens or pushes to until someone with write access approves
# them, while a pull request that a personal token or a GitHub App token opens
# or pushes to runs its workflows as any pull request does:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
# The build and links checks master requires come from the pull request's own
# runs. Pull request 337, opened with GITHUB_TOKEN on 19 October 2026, had its
# six pull_request runs held for approval, so its head never got a links check.
#
# The pull request's own runs can read repository secrets, as the runs of a
# pull request from any branch of this repository can, so a step in a
# pull_request workflow that reads a secret would run next to dependency
# updates nobody has read yet. No pull_request workflow here reads one besides
# GITHUB_TOKEN.

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC weekly
  workflow_dispatch: {}

# A second bump run waits for the first, so two runs never push the branch over
# each other.
concurrency:
  group: bump-framers-deps
  cancel-in-progress: false

# The branch push and the pull request go through FRAMERS_BUMP_TOKEN, so the
# job's own GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # FRAMERS_BUMP_TOKEN reaches past this repository, and a step can change what a
    # later step of its job runs, so no install script runs in this job and its
    # third-party actions are pinned to a commit, with the release that commit
    # carries named beside it.
    steps:
      # First, before anything is installed: with the secret empty,
      # create-pull-request stops with "Input 'token' not supplied", but only after
      # the install.
      - name: FRAMERS_BUMP_TOKEN is available
        env:
          FRAMERS_BUMP_TOKEN: ${{ secrets.FRAMERS_BUMP_TOKEN }}
        run: |
          if [ -z "$FRAMERS_BUMP_TOKEN" ]; then
            echo "::error::FRAMERS_BUMP_TOKEN is not available to this repository; a pull request opened with GITHUB_TOKEN gets no CI job."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # master, whichever branch a manual run names: the pull request goes into
          # master, and a bump of another branch's manifests is not master's.
          ref: master
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # create-pull-request sets up its own authentication to push, so the token
          # is not left in .git/config for the steps after this one.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up pnpm
        # No `version:` input; action-setup@v6 derives the pnpm version
        # from the `packageManager: pnpm@...` field in package.json. Passing
        # both raises "Multiple versions of pnpm specified"
        # (ERR_PNPM_BAD_PM_VERSION) and aborts the job.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # pnpm/action-setup runs first; setup-node 6 and later cache pnpm only when asked.
          cache: pnpm

      - name: Update submodules to latest (when present)
        run: |
          if [ -f .gitmodules ]; then
            git submodule update --remote --recursive
          fi

      - name: Bump @framers/* deps to latest published versions
        run: python3 .github/scripts/bump-framers-deps.py

      - name: Refresh pnpm lockfile (when present)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            # Refreshing the lockfile needs no package's install script.
            pnpm install --no-frozen-lockfile --ignore-scripts
          fi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # The personal token, so the pull request's own events start its workflows
          # (see the top of this file). branch-token defaults to it, so the branch
          # push goes through it too.
          token: ${{ secrets.FRAMERS_BUMP_TOKEN }}
          commit-message: 'chore(deps): bump @framers/* deps to latest published versions'
          title: 'chore(deps): bump @framers/* deps to latest published versions'
          body: |
            Automated weekly bump of all `@framers/*` dependencies to their
            latest npm-published versions.

            Includes (when applicable):
            - `package.json` explicit-pin updates (caret semver of latest)
            - `pnpm-lock.yaml` refresh
            - Git submodule pointer updates (where the parent repo has submodules)

            Workspace `workspace:*` pins are not touched. Review the diff
            for any unexpected major-version jumps before merging.
          branch: chore/bump-framers-deps
          base: master
          delete-branch: true
          # No .gitmodules here: this repo carries no submodules, and the
          # action's git add on a missing pathspec fatals — every scheduled
          # bump since 2026-06 died on exactly that.
          add-paths: |
            package.json
            **/package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
