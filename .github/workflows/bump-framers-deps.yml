name: Bump @framers/* deps

# Weekly cron + manual trigger. Bumps every @framers/* explicit version pin
# in package.json files to the latest npm-published version, refreshes the
# pnpm lockfile when present, bumps git submodule pointers when present,
# and opens a single Pull Request with the diff. The same workflow drops
# into every repo that depends on the agentos family.
#
# The branch is pushed and the pull request opened with FRAMERS_BUMP_TOKEN, a
# personal token held as a framerslab organization secret, never with
# GITHUB_TOKEN. GitHub holds the pull_request runs of a pull request that
# GITHUB_TOKEN opens or pushes to until someone with write access approves
# them, while a pull request that a personal token or a GitHub App token opens
# or pushes to runs its workflows as any pull request does:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
# The build and links checks master requires come from the pull request's own
# runs. Pull request 337, opened with GITHUB_TOKEN on 19 October 2026, had its
# six pull_request runs held for approval, so its head never got a links check.
#
# The pull request's own runs can read repository secrets, as the runs of a
# pull request from any branch of this repository can, so a step in a
# pull_request workflow that reads a secret would run next to dependency
# updates nobody has read yet. No pull_request workflow here reads one besides
# GITHUB_TOKEN: on a pull request this workflow runs the dry-run job, which
# reads none, and skips the bump job, which reads FRAMERS_BUMP_TOKEN.

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC weekly
  workflow_dispatch: {}
  # A pull request that changes this workflow, its scripts or pnpm-workspace.yaml (the override the
  # bump moves and the release-age exemption the gate needs) runs the dry-run job at the end of this
  # file: the script, the lockfile refresh, its integrity check and Dependabot's release-age gate
  # run for real, and no pull request is opened.
  pull_request:
    paths:
      - .github/workflows/bump-framers-deps.yml
      - .github/scripts/bump-framers-deps.py
      - .github/scripts/check-lockfile-integrity.mjs
      - pnpm-workspace.yaml

# A second bump run waits for the first, so two runs never push the branch over
# each other. A pull request's dry run keys a group of its own, and a newer push
# to the pull request cancels the dry run of the commit it replaces.
concurrency:
  group: bump-framers-deps-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The branch push and the pull request go through FRAMERS_BUMP_TOKEN, so the
# bump job's own GITHUB_TOKEN only reads, as the dry run's does.
permissions:
  contents: read

jobs:
  bump:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # FRAMERS_BUMP_TOKEN reaches past this repository, and a step can change what a
    # later step of its job runs, so no install script runs in this job and its
    # third-party actions are pinned to a commit, with the release that commit
    # carries named beside it.
    steps:
      # First, before anything is installed: with the secret empty,
      # create-pull-request stops with "Input 'token' not supplied", but only after
      # the install.
      - name: FRAMERS_BUMP_TOKEN is available
        env:
          FRAMERS_BUMP_TOKEN: ${{ secrets.FRAMERS_BUMP_TOKEN }}
        run: |
          if [ -z "$FRAMERS_BUMP_TOKEN" ]; then
            echo "::error::FRAMERS_BUMP_TOKEN is not available to this repository; a pull request opened with GITHUB_TOKEN gets no CI job."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # master, whichever branch a manual run names: the pull request goes into
          # master, and a bump of another branch's manifests is not master's.
          ref: master
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # create-pull-request sets up its own authentication to push, so the token
          # is not left in .git/config for the steps after this one.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up pnpm
        # No `version:` input; action-setup@v6 derives the pnpm version
        # from the `packageManager: pnpm@...` field in package.json. Passing
        # both raises "Multiple versions of pnpm specified"
        # (ERR_PNPM_BAD_PM_VERSION) and aborts the job.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # No pnpm store comes back from the Actions cache, so the refresh below starts on an empty
          # store. pnpm 10.33.4 and later write a git-hosted tarball's integrity into the lockfile only
          # when they download the tarball, so a refresh on a restored store drops it: framerslab/agentos
          # pull request 559 dropped libsignal's (the integrity check's script names the places in pnpm).
          # setup-node caches pnpm only when cache names it, and this keeps it from caching anything on
          # its own.
          package-manager-cache: false

      - name: Update submodules to latest (when present)
        run: |
          if [ -f .gitmodules ]; then
            git submodule update --remote --recursive
          fi

      - name: Bump @framers/* deps to latest published versions
        run: python3 .github/scripts/bump-framers-deps.py

      - name: Refresh pnpm lockfile (when present)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            # Refreshing the lockfile needs no package's install script. With the lockfile already up to
            # date with the manifests (no pin moved), pnpm skips the resolution step and leaves the
            # lockfile as it is; --no-prefer-frozen-lockfile runs that step anyway, so on the empty store
            # pnpm downloads the two git-hosted tarballs (@whiskeysockets/eslint-config and libsignal) and
            # pins their integrity, putting back one an earlier refresh dropped. That takes pnpm 10.33.4 or
            # later, as package.json's packageManager names; an older pnpm pins none.
            pnpm install --no-frozen-lockfile --no-prefer-frozen-lockfile --ignore-scripts
          fi

      # pnpm installs a git-hosted entry whose integrity is gone without a word, so a refresh that
      # drops one passes every check after it. This fails the run when an entry the refresh kept
      # lost or changed the integrity the checked-out lockfile pins.
      - name: The refresh keeps every integrity the lockfile pins
        run: |
          if [ -f pnpm-lock.yaml ]; then
            git show HEAD:pnpm-lock.yaml > "$RUNNER_TEMP/pnpm-lock.before.yaml"
            node .github/scripts/check-lockfile-integrity.mjs "$RUNNER_TEMP/pnpm-lock.before.yaml" pnpm-lock.yaml
          fi

      # Dependabot updates the lockfile with pnpm's minimumReleaseAge at 4320 minutes (three days),
      # which pnpm 10.16 and later apply, and its update fails with ERR_PNPM_NO_MATURE_MATCHING_VERSION
      # when a range of a workspace project admits no release that old. The pins above are the newest
      # @framers releases, younger than that for days after a bump. This runs an update with
      # Dependabot's flags on the bumped manifests, so the run fails where Dependabot's updates would
      # fail once the bump merges. Dependabot names its package with a version
      # (`pnpm update <package>@<version>`), and pnpm then updates every dependency of every project,
      # as it does with no package named; a package named without a version limits the update to
      # that package. The refreshed lockfile is put back after it.
      - name: Dependabot's release-age gate resolves the bump
        run: |
          if [ -f pnpm-lock.yaml ]; then
            cp pnpm-lock.yaml "$RUNNER_TEMP/pnpm-lock.refreshed.yaml"
            pnpm update --lockfile-only --no-save -r --config.minimum-release-age=4320
            cp "$RUNNER_TEMP/pnpm-lock.refreshed.yaml" pnpm-lock.yaml
          fi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # The personal token, so the pull request's own events start its workflows
          # (see the top of this file). branch-token defaults to it, so the branch
          # push goes through it too.
          token: ${{ secrets.FRAMERS_BUMP_TOKEN }}
          commit-message: 'chore(deps): bump @framers/* deps to latest published versions'
          title: 'chore(deps): bump @framers/* deps to latest published versions'
          body: |
            Automated weekly bump of all `@framers/*` dependencies to their
            latest npm-published versions.

            Includes (when applicable):
            - `package.json` explicit-pin updates (caret semver of latest)
            - `pnpm-lock.yaml` refresh
            - Git submodule pointer updates (where the parent repo has submodules)

            Workspace `workspace:*` pins are not touched. Review the diff
            for any unexpected major-version jumps before merging.
          branch: chore/bump-framers-deps
          base: master
          delete-branch: true
          # No .gitmodules here: this repo carries no submodules, and the
          # action's git add on a missing pathspec fatals — every scheduled
          # bump since 2026-06 died on exactly that.
          add-paths: |
            package.json
            **/package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml

  # The bump, end to end, on a pull request that changes it: the script against this repository's
  # manifests and the npm registry, then the lockfile refresh, its integrity check and Dependabot's
  # release-age gate. The steps are the bump job's, less the token check, the master checkout and
  # the pull request; keep the two in step. Nothing is committed and no pull request is opened.
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # An empty store, as in the bump job.
          package-manager-cache: false

      - name: Update submodules to latest (when present)
        run: |
          if [ -f .gitmodules ]; then
            git submodule update --remote --recursive
          fi

      - name: Bump @framers/* deps to latest published versions
        run: python3 .github/scripts/bump-framers-deps.py

      - name: Refresh pnpm lockfile (when present)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile --no-prefer-frozen-lockfile --ignore-scripts
          fi

      - name: The refresh keeps every integrity the lockfile pins
        run: |
          if [ -f pnpm-lock.yaml ]; then
            git show HEAD:pnpm-lock.yaml > "$RUNNER_TEMP/pnpm-lock.before.yaml"
            node .github/scripts/check-lockfile-integrity.mjs "$RUNNER_TEMP/pnpm-lock.before.yaml" pnpm-lock.yaml
          fi

      - name: Dependabot's release-age gate resolves the bump
        run: |
          if [ -f pnpm-lock.yaml ]; then
            cp pnpm-lock.yaml "$RUNNER_TEMP/pnpm-lock.refreshed.yaml"
            pnpm update --lockfile-only --no-save -r --config.minimum-release-age=4320
            cp "$RUNNER_TEMP/pnpm-lock.refreshed.yaml" pnpm-lock.yaml
          fi

      - name: What the bump would commit
        run: |
          git status --porcelain
          git diff --stat
