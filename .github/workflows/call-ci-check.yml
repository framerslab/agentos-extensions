name: Call CI (temporary check)

# Temporary, removed before this pull request is marked ready. It calls ci.yml through
# workflow_call as release.yml does: on a push to this branch with release.yml's own
# concurrency form, and on the pull request with a group of its own per run, so the
# called run's pull request group can be compared with ci.yml's own.
on:
  push:
    branches: [ci/pull-request-runs-cancel-superseded]
  pull_request:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
