name: Release & Publish

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      update_registry:
        description: 'Write registry.json from this branch and push it even when this run publishes nothing: the recovery for a release whose registry step failed.'
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  actions: write

jobs:
  # The build, the tests and the pack guard run on the exact revision that is
  # about to be released; a red run publishes nothing.
  # It installs dependencies and runs their scripts and every test suite, so it
  # gets a read-only token: only the release job below can write or publish.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # pnpm/action-setup runs first; setup-node 6 and later cache pnpm only when asked.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build extensions
        run: pnpm run build

      - name: Configure npm auth for publish
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm auth
        run: npm whoami --registry https://registry.npmjs.org/

      # changesets/action v2 works only with Changesets CLI 3, and v1 only with
      # CLI 2, so the CLI in package.json and this action move together. v2 takes
      # its token from the github-token input (github.token by default), and
      # push-with-git-cli keeps v1's git pushes and annotated tags. Unlike v1, v2
      # only warns when a tag push fails; the next step checks the tags.
      # Trusted publishing needs npm 11.5.1 or later; pnpm publishes through the npm on PATH.
      - name: npm 11.20.0 for trusted publishing
        run: npm install -g npm@11.20.0 && npm --version

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          version-script: pnpm run version-packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          push-with-git-cli: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # v2 pushes each tag with its own git push, all at once, and when a push
      # fails it only warns ("Assuming it was manually pushed"). The release it
      # then creates names no commit, so GitHub makes the missing tag at the
      # branch's head, which is a later commit when a push landed during the run.
      # Runs 38105665849 and 38165480649 left 168 tags so, in green runs (80
      # pushes answered 429, 88 were refused); they were moved to the commits
      # npm's provenance names on 2026-10-12. Every tag this run published must
      # name the commit `changeset publish` tagged here: a wrong or missing one is
      # pushed from this checkout's annotated tag, all in one push, and the run
      # fails when any is still wrong.
      - name: Check that each release tag names the published commit
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs['published-packages'] }}
        run: |
          head=$(git rev-parse HEAD)
          tags=$(node -e "for (const p of JSON.parse(process.env.PUBLISHED)) console.log(p.name + '@' + p.version)")
          count=$(printf '%s\n' "$tags" | grep -c .)
          wrong=()
          check() {
            wrong=()
            local remote sha tag
            remote=$(git ls-remote --tags origin)
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              # An annotated tag's peeled entry names its commit; a lightweight tag names it itself.
              sha=$(printf '%s\n' "$remote" | awk -v ref="refs/tags/${tag}^{}" '$2 == ref { print $1 }')
              [ -n "$sha" ] || sha=$(printf '%s\n' "$remote" | awk -v ref="refs/tags/${tag}" '$2 == ref { print $1 }')
              [ "$sha" = "$head" ] || wrong+=("$tag")
            done <<< "$tags"
          }
          check
          if [ "${#wrong[@]}" -eq 0 ]; then
            echo "All ${count} release tags name ${head}."
            exit 0
          fi
          echo "::warning::${#wrong[@]} of ${count} release tags do not name ${head}; pushing this checkout's tags for them."
          refspecs=()
          for tag in "${wrong[@]}"; do
            if [ "$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")" != "$head" ]; then
              echo "::error::This checkout has no tag ${tag} at ${head}."
              exit 1
            fi
            refspecs+=("+refs/tags/${tag}:refs/tags/${tag}")
          done
          # A 429 ("repository is too busy") passes; a refusal does not, and the run then fails below.
          for attempt in 1 2 3; do
            git push --atomic origin "${refspecs[@]}" || echo "::warning::Pushing the tags failed (attempt ${attempt} of 3)."
            check
            if [ "${#wrong[@]}" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $(( attempt * 20 ))
            fi
          done
          if [ "${#wrong[@]}" -gt 0 ]; then
            echo "::error::${#wrong[@]} release tags still do not name ${head}: ${wrong[*]}. Push each from ${head} with a token that may push it (a commit whose workflow files differ from the branch needs the workflows permission): git tag -f -a <tag> -m <tag> ${head} && git push --force origin refs/tags/<tag>."
            exit 1
          fi
          echo "Pushed ${#refspecs[@]} release tags; all ${count} name ${head}."

      # registry.json is written from this run's tree, which holds the versions
      # this run published. A pull request that merges while the job runs moves
      # the branch, and a plain push is then refused as non-fast-forward (runs
      # 37646818880 and 37713400316), so the file is laid on the branch's newest
      # commit and the push is tried again. The branch is the run's own: master
      # for a push, the chosen branch for a manual run. Release runs on one
      # branch never overlap (the concurrency group above).
      #
      # A re-run of a job whose publish succeeded and whose registry step
      # failed publishes nothing (every version is on npm already), so this
      # step would be skipped and the run would go green with registry.json
      # stale. A manual run with update_registry set runs it regardless, but
      # never while changesets are pending: the action above has then run the
      # version script, and the checkout holds versions, and any new pack,
      # that are not on npm.
      - name: Refuse a registry recovery while changesets are pending
        if: inputs.update_registry == true && steps.changesets.outputs['has-changesets'] == 'true'
        run: |
          echo "::error::update_registry was asked for, but changesets are pending: this checkout holds versions that are not published. Merge the version pull request; the release it starts writes registry.json."
          exit 1

      # The version pull request carries registry.json (version-packages regenerates it), so after a publish master
      # already matches. When it does not (a dispatch with update_registry, or a manifest changed outside a release),
      # the update reaches master the way every change does: a pull request with the label landing, merged once its
      # required checks pass and its review comments are read. master is protected (build and links required,
      # administrators included), so a direct push is refused: GH006 on run 39191821853, 19 October 2026, after
      # 0.9.0 had published. A pull request this token opens gets no pull_request runs until a maintainer approves
      # them, so the step dispatches ci.yml and links.yml on the branch itself.
      - name: Update registry after publish
        if: steps.changesets.outputs.published == 'true' || (inputs.update_registry == true && steps.changesets.outputs['has-changesets'] != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-registry.js
          cp registry.json "$RUNNER_TEMP/registry.json"
          git fetch --quiet origin master
          git reset --quiet --hard origin/master
          cp "$RUNNER_TEMP/registry.json" registry.json
          if git diff --quiet -- registry.json; then
            echo "registry.json on master already matches this release."
            exit 0
          fi
          branch="chore/registry-update-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --quiet -b "$branch"
          git add registry.json
          git commit --quiet -m "chore: update the extension registry after the release"
          git push --quiet origin "HEAD:refs/heads/$branch"
          gh pr create --base master --head "$branch" --label landing \
            --title "chore: update the extension registry after the release" \
            --body "registry.json regenerated by the release workflow (run $GITHUB_RUN_ID) from the packages' manifests and versions. It merges as every landing does, once its required checks pass and its review comments are read."
          gh workflow run ci.yml --ref "$branch"
          gh workflow run links.yml --ref "$branch"
