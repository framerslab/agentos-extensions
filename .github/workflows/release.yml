name: Release & Publish

# npm's trusted publishers for these packages name this repository and this workflow file, release.yml: npm compares
# the file's name with the run that publishes (https://docs.npmjs.com/trusted-publishers), so the file keeps its name
# and no other workflow publishes.
on:
  push:
    branches: [master]
  workflow_dispatch:

# One run at a time for a ref, and one pending behind it: a newer push replaces the pending run and cancels nothing.
# The running run's publish step reads master's head again before each package and stops, green, once master has moved
# past its commit; the newer commit's run plans from npm and the tags and so publishes those changes too.
concurrency: ${{ github.workflow }}-${{ github.ref }}

# contents: write pushes the release tags and creates the GitHub releases; packages: write writes the images' version
# tags on GHCR; id-token: write lets npm authenticate the publish through OIDC (trusted publishing, with provenance);
# actions: read lets the images step read the image workflows' runs. The run opens no pull request, pushes no branch
# and dispatches nothing.
permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  # CI plans the release (scripts/release-plan.mjs plan and apply), then builds, tests and packs the exact revision
  # being released, with the plan written into its checkout: the pack guard packs each planned package into the
  # tarball directory, and the job uploads the plan and the tarballs as the artifacts release-plan and
  # release-tarballs. A red run publishes nothing. It installs dependencies and runs their scripts and every test
  # suite, so it gets a read-only token: only the release job below can write or publish.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The release runs on master alone: a run started by hand on another branch runs CI, whose plan is then a dry run,
  # and publishes nothing. It installs and builds nothing: it publishes the tarballs CI packed and tested, byte for
  # byte, so what is published is what was tested. Its time limit holds the publish step's waits for its dependencies'
  # documents on npm (up to 30 minutes in all, however many dependents the plan orders: DOCUMENT_WAIT in
  # scripts/release-plan.mjs), the images step's one wait for the image runs (up to 45 minutes, IMAGE_WAIT) and the
  # publishes, the tags and the releases beside them.
  release:
    needs: ci
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Every commit and tag: the tags step reads the tags in place and pushes the new ones, the images step reads
      # each release tag's commit and the history before it. No credential is kept in the checkout's git config, since
      # nothing here installs or runs the repository's code: the tags step passes the job's token to its one push.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # registry-url makes setup-node write an npm config whose auth line reads NODE_AUTH_TOKEN, which the publish
      # step alone sets: the token npm falls back to for a package with no trusted publisher
      # (https://github.com/actions/setup-node#usage).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The plan and the tarballs the ci job above uploaded from this run.
      - name: Download the plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan

      - name: Download the tarballs
        uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release-tarballs

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm 11.20.0 for trusted publishing
        run: npm install -g npm@11.20.0 && npm --version

      # Publishes each planned tarball with npm publish, in the plan's order, a dependency before its dependents and
      # the root last, after checking that the tarball directory is the plan's. Before each package it reads master's
      # head again: once master has moved past this commit it stops, green, and the newer commit's run publishes the
      # rest. It reads the package's versions on npm again, and a version npm gained during the run fails the step,
      # unless it is the planned version as these tarballs made it (its gitHead this commit and its integrity the
      # tarball's): an earlier attempt of this run published it, since a re-run replays the first attempt's plan and
      # tarballs, and it is journaled and not published again. Each accepted publish is appended to the journal before
      # the next starts, and a dependent waits until npm serves the version of the sibling it names. The npm token sits
      # on this step alone, as npm's fallback for a package with no trusted publisher; npm tries OIDC first. When it ends
      # the step reads each published version's publisher on npm and warns for one that came through the token.
      - name: Publish the planned tarballs
        id: publish
        run: node scripts/release-plan.mjs publish --plan "$RUNNER_TEMP/release-plan/release-plan.json" --journal "$RUNNER_TEMP/published.jsonl" --tarballs "$RUNNER_TEMP/release-tarballs"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # Tags each version the journal records as published, and each repair the plan names, at the commit it was
      # published from, in one atomic push, then creates each tag's GitHub release. It runs after a failed publish
      # too, so every version npm accepted is tagged and released, and the step then fails naming what was left
      # unpublished, less a package whose tag names this commit already, which an earlier attempt of the run published.
      - name: Tags and releases
        id: tags
        if: always()
        run: node scripts/release-plan.mjs tags --plan "$RUNNER_TEMP/release-plan/release-plan.json" --journal "$RUNNER_TEMP/published.jsonl"
        env:
          GH_TOKEN: ${{ github.token }}

      # The only writer of the images' version tags: for each image pack in scripts/package-roles.json, each released
      # version's image is copied from the image workflow's tested sha- image of its image commit, with no rebuild.
      # It reconciles on every run, whether or not this one published, and never moves a version tag GHCR holds.
      - name: Image version tags
        id: images
        if: always()
        run: node scripts/release-plan.mjs images
        env:
          GH_TOKEN: ${{ github.token }}
