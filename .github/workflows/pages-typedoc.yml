name: Build and deploy Typedoc to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # This job installs with plain npm. Without an explicit opt-out,
          # setup-node v5 auto-detects the `packageManager: pnpm@...` field in
          # package.json, tries to enable its pnpm cache, and fails with
          # "Unable to locate executable file: pnpm" because pnpm is never
          # installed here. Disable the package-manager cache entirely.
          package-manager-cache: false
      - name: Install
        run: npm install
      - name: Generate typedoc
        run: |
          npm run docs || npx typedoc
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
