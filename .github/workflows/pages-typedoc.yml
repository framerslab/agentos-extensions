name: Build and deploy Typedoc to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # This job installs with plain npm, while package.json names pnpm in
          # its packageManager field. setup-node v5 enabled a pnpm cache from
          # that field and failed with "Unable to locate executable file: pnpm",
          # because pnpm is never installed here; v6 and later cache on their own
          # only for npm. The explicit opt-out keeps this job off the cache.
          package-manager-cache: false
      - name: Install
        run: npm install
      - name: Generate typedoc
        run: |
          npm run docs || npx typedoc
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
