name: Nightly real join

# Sends the browser meeting bot into a Google Meet and a Microsoft Teams meeting that this workflow creates in the
# team's own tenants, through the worker's scheduler, and records per platform whether the bot was admitted, posted
# its notice, started its capture and left. No meeting of anyone else is joined. It runs on the repository secrets
# named in the first step and skips, with a line saying which are missing, until they are set.

on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch: {}

permissions: { contents: read }

jobs:
  meet-and-teams:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the secrets
        id: secrets
        env:
          MEETING_SCHEDULER_URL: ${{ secrets.MEETING_SCHEDULER_URL }}
          MEETING_SCHEDULER_TOKEN: ${{ secrets.MEETING_SCHEDULER_TOKEN }}
          MEET_CALENDAR_SA_JSON: ${{ secrets.MEET_CALENDAR_SA_JSON }}
          MEET_HOST_USER: ${{ secrets.MEET_HOST_USER }}
          MEET_BOT_IDENTITY: ${{ secrets.MEET_BOT_IDENTITY }}
          TEAMS_GRAPH_TENANT_ID: ${{ secrets.TEAMS_GRAPH_TENANT_ID }}
          TEAMS_GRAPH_CLIENT_ID: ${{ secrets.TEAMS_GRAPH_CLIENT_ID }}
          TEAMS_GRAPH_CLIENT_SECRET: ${{ secrets.TEAMS_GRAPH_CLIENT_SECRET }}
          TEAMS_ORGANIZER_USER_ID: ${{ secrets.TEAMS_ORGANIZER_USER_ID }}
          NIGHTLY_LIVEKIT_URL: ${{ secrets.NIGHTLY_LIVEKIT_URL }}
          NIGHTLY_LIVEKIT_API_KEY: ${{ secrets.NIGHTLY_LIVEKIT_API_KEY }}
          NIGHTLY_LIVEKIT_API_SECRET: ${{ secrets.NIGHTLY_LIVEKIT_API_SECRET }}
        run: |
          missing=()
          for name in MEETING_SCHEDULER_URL MEETING_SCHEDULER_TOKEN MEET_CALENDAR_SA_JSON MEET_HOST_USER MEET_BOT_IDENTITY \
            TEAMS_GRAPH_TENANT_ID TEAMS_GRAPH_CLIENT_ID TEAMS_GRAPH_CLIENT_SECRET TEAMS_ORGANIZER_USER_ID \
            NIGHTLY_LIVEKIT_URL NIGHTLY_LIVEKIT_API_KEY NIGHTLY_LIVEKIT_API_SECRET; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Skipped: the nightly real-join check needs the repository secrets ${missing[*]}, which are not set."
            echo "::notice title=Nightly real join skipped::the repository secrets ${missing[*]} are not set"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with: { node-version: 24 }
      - name: Install the LiveKit token library
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --prefix registry/curated/meetings/browser/image/test --no-audit --no-fund
      - name: Create the meetings in our own tenants
        id: meetings
        if: steps.secrets.outputs.ready == 'true'
        env:
          MEET_CALENDAR_SA_JSON: ${{ secrets.MEET_CALENDAR_SA_JSON }}
          MEET_HOST_USER: ${{ secrets.MEET_HOST_USER }}
          MEET_BOT_IDENTITY: ${{ secrets.MEET_BOT_IDENTITY }}
          TEAMS_GRAPH_TENANT_ID: ${{ secrets.TEAMS_GRAPH_TENANT_ID }}
          TEAMS_GRAPH_CLIENT_ID: ${{ secrets.TEAMS_GRAPH_CLIENT_ID }}
          TEAMS_GRAPH_CLIENT_SECRET: ${{ secrets.TEAMS_GRAPH_CLIENT_SECRET }}
          TEAMS_ORGANIZER_USER_ID: ${{ secrets.TEAMS_ORGANIZER_USER_ID }}
        run: node registry/curated/meetings/browser/image/test/nightly/create-meetings.mjs >> "$GITHUB_OUTPUT"
      - name: Send the bot to each through the worker's scheduler and read the reports
        if: steps.secrets.outputs.ready == 'true'
        env:
          MEETING_SCHEDULER_URL: ${{ secrets.MEETING_SCHEDULER_URL }}
          MEETING_SCHEDULER_TOKEN: ${{ secrets.MEETING_SCHEDULER_TOKEN }}
          MEET_URL: ${{ steps.meetings.outputs.meet_url }}
          MEET_HOST: ${{ steps.meetings.outputs.meet_host }}
          MEET_HOST_USER: ${{ secrets.MEET_HOST_USER }}
          TEAMS_URL: ${{ steps.meetings.outputs.teams_url }}
          TEAMS_GRAPH_TENANT_ID: ${{ secrets.TEAMS_GRAPH_TENANT_ID }}
          NIGHTLY_LIVEKIT_URL: ${{ secrets.NIGHTLY_LIVEKIT_URL }}
          NIGHTLY_LIVEKIT_API_KEY: ${{ secrets.NIGHTLY_LIVEKIT_API_KEY }}
          NIGHTLY_LIVEKIT_API_SECRET: ${{ secrets.NIGHTLY_LIVEKIT_API_SECRET }}
        run: node registry/curated/meetings/browser/image/test/nightly/real-join.mjs
      - name: Record the outcome
        if: always() && steps.secrets.outputs.ready == 'true'
        run: cat registry/curated/meetings/browser/image/test/nightly/outcome.json || echo "no outcome was written"
      # the create step writes each meeting's ids as soon as it has made it, so a half-made pair is removed too
      - name: Remove the meetings
        if: always() && steps.meetings.outcome != 'skipped'
        env:
          MEET_CALENDAR_SA_JSON: ${{ secrets.MEET_CALENDAR_SA_JSON }}
          MEET_HOST_USER: ${{ secrets.MEET_HOST_USER }}
          MEET_EVENT_ID: ${{ steps.meetings.outputs.meet_event_id }}
          TEAMS_GRAPH_TENANT_ID: ${{ secrets.TEAMS_GRAPH_TENANT_ID }}
          TEAMS_GRAPH_CLIENT_ID: ${{ secrets.TEAMS_GRAPH_CLIENT_ID }}
          TEAMS_GRAPH_CLIENT_SECRET: ${{ secrets.TEAMS_GRAPH_CLIENT_SECRET }}
          TEAMS_ORGANIZER_USER_ID: ${{ secrets.TEAMS_ORGANIZER_USER_ID }}
          TEAMS_MEETING_ID: ${{ steps.meetings.outputs.teams_meeting_id }}
        run: node registry/curated/meetings/browser/image/test/nightly/create-meetings.mjs remove
