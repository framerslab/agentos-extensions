name: Nightly real join

# The Teams join probe: makes the check's own Teams meeting, runs a published bot image with
# image/test/nightly/probe-teams.mjs in the bot program's place against it, keeps the probe's screens and outline for a
# day, and removes the meeting. No meeting of anyone else is joined.

on:
  workflow_dispatch: {}

permissions: { contents: read }

jobs:
  teams-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/framerslab/agentos-meeting-bot@sha256:5a0f0649a1be73ef0efb1411b3a3b5f5301ab8c20a43547628829cd36b3a7491
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Pull the published image
        run: docker pull -q "$IMAGE"
      - name: Create the meeting in our own tenant
        id: meetings
        env:
          TEAMS_GRAPH_TENANT_ID: ${{ secrets.TEAMS_GRAPH_TENANT_ID }}
          TEAMS_GRAPH_CLIENT_ID: ${{ secrets.TEAMS_GRAPH_CLIENT_ID }}
          TEAMS_GRAPH_CLIENT_SECRET: ${{ secrets.TEAMS_GRAPH_CLIENT_SECRET }}
          TEAMS_ORGANIZER_USER_ID: ${{ secrets.TEAMS_ORGANIZER_USER_ID }}
        run: node registry/curated/meetings/browser/image/test/nightly/create-meetings.mjs --platform microsoft_teams >> "$GITHUB_OUTPUT"
      - name: Probe the join with the published image
        env:
          TEAMS_URL: ${{ steps.meetings.outputs.teams_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/probe" && chmod 777 "$RUNNER_TEMP/probe"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --security-opt seccomp=registry/curated/meetings/browser/image/seccomp.json \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m --tmpfs /home/bot/.cache:rw,noexec,nosuid,size=256m --tmpfs /run/pulse:rw,size=16m \
            --shm-size 1g --memory 3g --cpus 2 --pids-limit 512 \
            -e PROBE_URL="$TEAMS_URL" \
            -v "$PWD/registry/curated/meetings/browser/image/test/nightly/probe-teams.mjs:/app/dist/bot.js:ro" \
            -v "$RUNNER_TEMP/probe:/out" "$IMAGE" || echo "the probe exited $?"
          ls -la "$RUNNER_TEMP/probe" | head -100
      - name: Keep the probe's screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teams-probe
          path: ${{ runner.temp }}/probe
          retention-days: 1
          if-no-files-found: warn
      - name: Remove the meeting
        if: always() && steps.meetings.outcome != 'skipped'
        env:
          TEAMS_GRAPH_TENANT_ID: ${{ secrets.TEAMS_GRAPH_TENANT_ID }}
          TEAMS_GRAPH_CLIENT_ID: ${{ secrets.TEAMS_GRAPH_CLIENT_ID }}
          TEAMS_GRAPH_CLIENT_SECRET: ${{ secrets.TEAMS_GRAPH_CLIENT_SECRET }}
          TEAMS_ORGANIZER_USER_ID: ${{ secrets.TEAMS_ORGANIZER_USER_ID }}
          TEAMS_MEETING_ID: ${{ steps.meetings.outputs.teams_meeting_id }}
        run: node registry/curated/meetings/browser/image/test/nightly/create-meetings.mjs remove --platform microsoft_teams
