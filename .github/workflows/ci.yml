name: CI

# A push to master runs this through the release workflow (workflow_call), so
# there is no push trigger here: one run per push, and the release waits for it.
# workflow_dispatch runs it by hand on any branch.
on:
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

# A newer push to a pull request cancels the run of the commit it replaces. Every
# other run keys a group of its own, its run id, so it never waits behind another run
# and nothing cancels it: the call from release.yml on a push to master, and a
# dispatched run. A re-run keys its own group too, so re-running an older commit's
# run never cancels the newest one.
# A called workflow reads its caller's github context, so inside the release call
# github.workflow and github.ref are the caller's, the two values release.yml's own
# group is built from, and the run id is the release run's: the call shares a group
# with nothing. In a call github.workflow_ref names the calling workflow's file, which
# keeps a call from a pull request workflow, if one is added, out of this workflow's
# own pull request group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}-{1}', github.event.pull_request.number, github.workflow_ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      source-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: source_fixture
          POSTGRES_PASSWORD: source_fixture
          POSTGRES_DB: source_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U source_fixture -d source_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENTOS_TEST_POSTGRES_URL: postgresql://source_fixture:source_fixture@localhost:5432/source_fixture
    steps:
      - uses: actions/checkout@v7

      - name: Checkout agentos core (peer dependency)
        uses: actions/checkout@v7
        with:
          repository: framerslab/agentos
          path: packages/agentos
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # pnpm/action-setup runs first; setup-node 6 and later cache pnpm only when asked.
          cache: pnpm

      # master's rules refuse a direct push (GH006), so a workflow step that pushes a commit there fails after
      # everything before it has run, as the registry step did after a publish (run 39191821853). This fails the
      # pull request that adds such a push; its tests show each kind of push it reads. It reads the YAML with yq,
      # which the Ubuntu runner carries.
      - name: No workflow pushes to master
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --test .github/scripts/check-workflow-pushes.test.mjs
          node .github/scripts/check-workflow-pushes.mjs

      # The bump workflow fails a lockfile refresh that drops or changes an integrity the lockfile
      # pins. Its tests run here, on every pull request; the bump's dry run runs only when the bump
      # changes.
      - name: The bump's lockfile integrity check
        run: node --test .github/scripts/check-lockfile-integrity.test.mjs

      - name: Resolve published source-store peer floor
        # Pins the @framers/agentos override and the account-sources peer floor to the core checkout's
        # release, or, while npm does not serve it yet (the minutes between a core release commit and its
        # publish), to the newest published release that the committed floor admits, with a notice.
        run: node scripts/resolve-core-release.mjs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build agentos core
        # `--ignore-workspace` is required because the agentos-extensions
        # pnpm-workspace.yaml at the repo root does not list packages/agentos
        # (it's a sibling clone, not a workspace member). Without the flag,
        # pnpm walks up to the root workspace, sees agentos isn't a member,
        # and silently no-ops — leaving packages/agentos/node_modules absent
        # and the build's `rimraf` clean step fails with "command not found".
        run: cd packages/agentos && pnpm install --no-frozen-lockfile --ignore-workspace && pnpm run build

      - name: Build extensions
        run: pnpm run build

      - name: Built Gmail OAuth exports, installed foundation at or above the peer floors
        # The pack's peers are floors with no upper bound; the resolver step above chooses the core installed here.
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { agentosPeerFloor, compareVersions } from './scripts/pack-guard-lib.mjs';
          import { GmailOAuthFlow, GmailOAuthFault, GMAIL_READONLY_SCOPE }
            from './registry/curated/productivity/gmail-source/dist/index.js';
          const base = new URL('./registry/curated/productivity/gmail-source/', import.meta.url);
          const pack = JSON.parse(readFileSync(new URL('package.json', base), 'utf8'));
          const require = createRequire(new URL('package.json', base));
          for (const name of ['@framers/agentos', '@framers/agentos-ext-account-sources']) {
            // agentosPeerFloor reads the ">=x.y.z" floor of the core's entry, so each peer range is handed to it under that name.
            const range = pack.peerDependencies?.[name];
            const floor = agentosPeerFloor({ peerDependencies: { '@framers/agentos': range } });
            if (floor === null) throw new Error(`gmail_peer_floor_unreadable: ${name} "${range}" is not a ">=x.y.z" floor`);
            const installed = require(`${name}/package.json`).version;
            if (compareVersions(installed, floor) < 0) {
              throw new Error(`gmail_foundation_below_floor: ${name} ${installed} is installed, below its peer floor >=${floor}`);
            }
            console.log(`${name} ${installed} meets its peer floor >=${floor}`);
          }
          if (typeof GmailOAuthFlow !== 'function' || typeof GmailOAuthFault !== 'function'
            || GMAIL_READONLY_SCOPE !== 'https://www.googleapis.com/auth/gmail.readonly') throw new Error('gmail_oauth_exports_missing');
          const flow = new GmailOAuthFlow({ clientId: 'fixture-client', clientSecret: 'fixture-secret',
            redirectUris: ['https://consumer.invalid/callback'] }, null,
            { fetchImpl: async () => { throw new Error('unexpected_network'); } });
          if (new URL(flow.begin({redirectUri:'https://consumer.invalid/callback'}).url).searchParams.get('scope')
            !== GMAIL_READONLY_SCOPE) throw new Error('gmail_scope_mismatch');
          JS

      - name: Built Gmail text helpers
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {
            GmailTextFault, sanitizeMailText, sanitizeMailMetadata, sanitizeMailHeaders, messageText,
          } from './registry/curated/productivity/gmail-source/dist/index.js';
          const policy = { maxInputCharacters: 2097152, maxLineCharacters: 65536, maxOutputCharacters: 20000 };
          const address = ['fixture', 'mail.invalid'].join(String.fromCharCode(64));
          assert.equal(sanitizeMailText(address, policy).text, '[address removed]');
          assert.equal(sanitizeMailMetadata('password=fixture-value', policy).text, '[secret removed]');
          assert.deepEqual(sanitizeMailHeaders([{name:'Bcc',value:address}], policy),
            {subject:'',date:'',from:'',to:'',cc:''});
          assert.equal(messageText('Fresh.\n\n> Old.', policy).text, 'Fresh.');
          assert.equal(new GmailTextFault('configuration').message, 'gmail_text_configuration');
          JS

      - name: Built Gmail mapping and inert HTML contract
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { GmailThreadMapper, GmailMappingFault }
            from './registry/curated/productivity/gmail-source/dist/index.js';
          import { createRequire } from 'node:module';
          const require = createRequire(new URL('./registry/curated/productivity/gmail-source/package.json', import.meta.url));
          const coreUrl = require.resolve('@framers/agentos/cognition/memory');
          const { HtmlLoader } = await import(coreUrl);
          assert.equal(typeof HtmlLoader, 'function');
          globalThis.fetch = async () => { throw new Error('unexpected_network'); };
          assert.equal((await new HtmlLoader().load(Buffer.from('<p>Fixture</p>'))).content, 'Fixture');
          assert.equal(new TextDecoder('iso-8859-1', { fatal: true }).decode(Uint8Array.of(0xe9)), 'é');
          assert.throws(() => new TextDecoder('utf-8', { fatal: true }).decode(Uint8Array.of(0xc3, 0x28)));
          const now = Date.UTC(2026, 0, 15, 12);
          const mapper = new GmailThreadMapper({
            maxResponseBytes:2097152,maxDecodedBytes:2097152,maxMimeDepth:20,maxMimeParts:1000,maxMessages:100,
            maxMessageCharacters:20000,maxThreadCharacters:200000,maxMetadataCharacters:200000,
            maxInputCharacters:2097152,maxLineCharacters:65536,maximumCacheMs:86400000,
          });
          const html = Buffer.from('<p>Visible fixture.</p><img src="https://resource.invalid/pixel">');
          const result = await mapper.map({id:'abc123',historyId:'9007199254740993123',messages:[{
            id:'a1',threadId:'abc123',internalDate:String(now-1000),labelIds:['INBOX'],payload:{
              mimeType:'text/html',headers:[{name:'Subject',value:'Fixture'}],
              body:{size:html.length,data:html.toString('base64url')},
            },
          }]}, {sourceId:'abc123',sourceDetailUrl:'/private/sources/fixture',cutoff:now,windowMs:2592000000,
            readStartedAt:now-100,receivedAt:now,permission:{evidenceId:'fixture-permission',retentionMs:86400000},
            cacheHeaders:{cacheControl:null,date:null,age:null,expires:null},labelNames:{INBOX:'Inbox'},
            labelCache:{kind:'cache',expiresAt:now+86400000,evidenceId:'fixture-permission'},
          });
          assert.equal(result.kind, 'document');
          assert.equal(result.document.read.content.text.slice(result.document.messages[0].start), 'Visible fixture.');
          assert.equal(result.document.read.item.version, result.document.read.ref.version);
          assert.equal(result.document.metadata.attachmentsRead, false);
          assert.equal(JSON.stringify(result).includes('resource.invalid'), false);
          assert.equal(new GmailMappingFault('configuration').message, 'gmail_mapping_configuration');
          JS

      - name: Built Gmail API and fixed failure exports
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {
            GmailApi, GmailApiFault, classifyGmailHttp, gmailOAuthFault, GmailOAuthFault,
          } from './registry/curated/productivity/gmail-source/dist/index.js';
          assert.equal(typeof GmailApi, 'function');
          assert.equal(new GmailApiFault('configuration').message, 'gmail_api_configuration');
          assert.deepEqual(classifyGmailHttp(404, null, 'read'), {kind:'gone'});
          assert.deepEqual(classifyGmailHttp(404, null, 'changes'), {kind:'fault',code:'history_expired'});
          assert.deepEqual(classifyGmailHttp(429, null, 'read'),
            {kind:'retry',code:'rate_limited',scope:'mailbox',daily:false});
          assert.equal(gmailOAuthFault(new GmailOAuthFault('scope')).code, 'insufficient_scope');
          assert.equal(gmailOAuthFault(new Error('private-fixture')).message, 'source_sync_invalid_response');
          JS

      - name: Built Gmail connector and runner exports
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {
            GmailSourceConnector, GmailConnectorFault, runGmailSourceSync, verifyGmailSource,
          } from './registry/curated/productivity/gmail-source/dist/index.js';
          assert.equal(typeof GmailSourceConnector, 'function');
          assert.equal(typeof GmailSourceConnector.prototype.dispose, 'function');
          assert.equal(typeof GmailSourceConnector.prototype.list, 'function');
          assert.equal(typeof GmailSourceConnector.prototype.read, 'function');
          assert.equal(typeof GmailSourceConnector.prototype.changesSince, 'function');
          assert.equal(typeof GmailSourceConnector.prototype.revoke, 'function');
          assert.equal(typeof runGmailSourceSync, 'function');
          assert.equal(typeof verifyGmailSource, 'function');
          const fault = new GmailConnectorFault('skipped', 'not_permitted');
          assert.equal(fault.message, 'gmail_connector_skipped');
          assert.equal(fault.skip, 'not_permitted');
          JS

      - name: Preserve the generated Gmail dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: gmail-source-dependency-lock
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Built account-source cache policy requires permission
        run: |
          node --input-type=module <<'JS'
          import { decideSourceCache } from './registry/curated/research/account-sources/dist/index.js';
          const input = {
            permission: null, maximumCacheMs: 10000, readStartedAt: 1000,
            receivedAt: 1100, windowExpiresAt: 9000,
            headers: { cacheControl: 'max-age=60', date: null, age: null, expires: null },
          };
          if (decideSourceCache(input).kind !== 'skip') throw new Error('permission_bypassed');
          const permitted = { ...input, permission: { evidenceId: 'policy-a', retentionMs: 5000 } };
          const cached = decideSourceCache(permitted);
          if (cached.kind !== 'cache' || cached.expiresAt !== 6000) throw new Error('retention_incorrect');
          const denied = decideSourceCache({ ...permitted, headers: { ...input.headers, cacheControl: 'no-store' } });
          if (denied.kind !== 'skip' || denied.reason !== 'no_store') throw new Error('no_store_bypassed');
          JS

      - name: Built account-source sync contracts retain unresolved work
        run: |
          node --input-type=module <<'JS'
          import {
            createSourceSyncState, transitionSourceSync, openSourceSyncCycle,
            advanceSourceSyncPage, committableSourceCursor,
          } from './registry/curated/research/account-sources/dist/index.js';
          const policy = {
            windowMs: 10000, maxRetainedDocuments: 5, maxHeldCharacters: 1000,
            maxIndexedCharacters: 2000, scanPageSize: 10, maxScanPages: 2, maxCandidates: 20,
            maxChangedPerLease: 10, maxHistoryPagesPerLease: 2, leaseMs: 120000,
            pollMs: 900000, manualMinIntervalMs: 60000, reconcileMs: 86400000,
          };
          const scope = { tenantId: 'tenant-a', ownerId: 'owner-a', connectionId: 'connection-a' };
          const started = transitionSourceSync(createSourceSyncState(scope, 0), { type: 'connect_started' }, 1);
          const ready = transitionSourceSync(started, {
            type: 'grant_ready', use: { searchAskEnabled: true, liveEnabled: false },
          }, 2);
          if (ready.generation !== 1 || ready.status !== 'connected') throw new Error('state_contract_failed');
          const opened = openSourceSyncCycle({
            cycleId: 'cycle-a', generation: 1, mode: 'incremental', cutoff: 100,
            fromCursor: '900719925474099312345678901',
          });
          const { checkpoint } = advanceSourceSyncPage(opened, {
            kind: 'history', ids: ['source-a'], nextPageToken: null,
            cursor: '900719925474099312345678999',
          }, policy);
          const work = {
            cycleId: checkpoint.cycleId, generation: 1, checkpointRevision: checkpoint.revision,
            total: 1, pending: 0, retry: 1, applied: 0, gone: 0, skipped: 0,
          };
          if (committableSourceCursor(checkpoint, work) !== null) throw new Error('retry_committed');
          const complete = { ...work, retry: 0, applied: 1 };
          if (committableSourceCursor(checkpoint, complete) !== '900719925474099312345678999') {
            throw new Error('opaque_cursor_changed');
          }
          JS

      - name: Built source quota exports
        run: |
          node --input-type=module <<'JS'
          import { SourceQuota, sourceQuotaSchema, sourceRetryAt } from './registry/curated/research/account-sources/dist/index.js';
          if (typeof SourceQuota !== 'function' || sourceQuotaSchema('fixture_quota').length !== 7) {
            throw new Error('source_quota_exports_missing');
          }
          if (sourceRetryAt(1000, 1, '172800', 0) !== 172801000) throw new Error('retry_after_shortened');
          JS

      - name: Built source coordinator exports
        run: |
          node --input-type=module <<'JS'
          import {
            AccountSourceSync, SqlAccountSourceSyncStore, sourceSyncCoordinatorSchema,
          } from './registry/curated/research/account-sources/dist/index.js';
          if (typeof AccountSourceSync !== 'function'
            || typeof SqlAccountSourceSyncStore.prototype.reserveOperation !== 'function'
            || typeof SqlAccountSourceSyncStore.prototype.deferOperation !== 'function'
            || typeof SqlAccountSourceSyncStore.prototype.pendingRetry !== 'function') {
            throw new Error('source_coordinator_exports_missing');
          }
          const ddl = sourceSyncCoordinatorSchema('fixture_sync');
          if (ddl.length !== 1 || !ddl[0].includes('ADD COLUMN IF NOT EXISTS operation JSONB')) {
            throw new Error('source_coordinator_schema_missing');
          }
          JS

      - name: Built source lifecycle exports
        run: |
          node --input-type=module <<'JS'
          import {
            SourceRevocations, sourceRevocationSchema, sourceGrantNamespace, SOURCE_GRANT_KEY,
            SqlAccountSourceSyncStore,
          } from './registry/curated/research/account-sources/dist/index.js';
          if (typeof SourceRevocations !== 'function' || sourceRevocationSchema('fixture_revoke').length !== 8
            || SOURCE_GRANT_KEY !== 'grant'
            || sourceGrantNamespace({tenantId:'tenant-a',ownerId:'owner-a',connectionId:'connection-a'})
              !== '["AccountSourceGrant","tenant-a","owner-a","connection-a"]') {
            throw new Error('source_revocation_exports_missing');
          }
          for (const name of ['withCurrentHandle','stageStop','stageOwnerStop','completeStop','lockState']) {
            if (typeof SqlAccountSourceSyncStore.prototype[name] !== 'function') throw new Error('source_lifecycle_transaction_missing');
          }
          for (const name of ['beginExchange','settleExchange','endExchange','mayInstallExchange']) {
            if (typeof SourceRevocations.prototype[name] !== 'function') throw new Error('source_exchange_cleanup_missing');
          }
          JS

      - name: Built citation-check exports, no network
        # Parses a document, checks it against a page an injected fetch serves, renders the log, constructs the pack and runs the bin.
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import {
            parseCitedClaims, checkCitations, citationReportFails, renderCitationLog, createExtensionPack,
          } from './registry/curated/research/citation-check/dist/index.js';
          globalThis.fetch = async () => { throw new Error('unexpected_network'); };
          const claims = parseCitedClaims(
            'It says "The harbour opened in 1887" (https://page.invalid/a, read 1 Jan 2026) and "a claim that cites no page at all" here.');
          assert.deepEqual(claims.map((claim) => claim.url), ['https://page.invalid/a', null]);
          const page = async () => new Response('<p>The harbour opened in 1887.</p>', { headers: { 'content-type': 'text/html' } });
          const report = await checkCitations(claims, { fetch: page });
          assert.deepEqual(report.checks.map((check) => check.verdict), ['exact', 'uncited']);
          assert.equal(citationReportFails(report), false);
          assert.match(renderCitationLog(report), /\| 1 \| exact \| The harbour opened in 1887 \|/);
          assert.equal(createExtensionPack({ options: {} }).descriptors[0].id, 'citation_verify');
          const usage = execFileSync(process.execPath, ['./registry/curated/research/citation-check/dist/bin.js', '--help'], { encoding: 'utf8' });
          assert.match(usage, /^Usage: agentos-citations verify <file>/);
          JS

      - name: Test the release scripts
        # Node 22 takes files or globs here, not a directory to walk.
        run: node --test scripts/__tests__/*.test.mjs

      - name: Test extensions (skip agentos core tests — tested upstream)
        run: pnpm -r --filter '!@framers/agentos' --if-present run test

      - name: Built SQL source exports
        # Runs in the pack's folder: the core resolves from the pack's own dependencies, not from the root.
        working-directory: registry/curated/research/account-sources
        run: |
          node --input-type=module <<'JS'
          import { SqlAccountSourceSyncStore, sourceSyncSchema } from './dist/index.js';
          import { SqlSourceDerivationStore } from '@framers/agentos/cognition/library';
          if (typeof SqlAccountSourceSyncStore !== 'function' || typeof SqlSourceDerivationStore !== 'function') {
            throw new Error('source_store_exports_missing');
          }
          const statements = sourceSyncSchema('fixture_sync');
          // four tables and four indexes: due, expiry, and the work table's by disposition and by retry time
          if (statements.length !== 8 || statements.some((sql) => sql.includes('?'))) {
            throw new Error('source_schema_contract_failed');
          }
          JS

      - name: Source-store dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-store-dependencies
          path: |
            registry/curated/research/account-sources/package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml

      - name: Pack guard (unpublished versions and packages with a pending changeset)
        run: node scripts/pack-guard.mjs
