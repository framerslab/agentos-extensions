name: CI

# A push to master runs this through the release workflow (workflow_call), so
# there is no push trigger here: one run per push, and the release waits for it.
# The weekly bump workflow dispatches it on its pull request branch, because
# GitHub holds the pull_request runs of a pull request that GITHUB_TOKEN opens
# until a maintainer approves them.
on:
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      source-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: source_fixture
          POSTGRES_PASSWORD: source_fixture
          POSTGRES_DB: source_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U source_fixture -d source_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENTOS_TEST_POSTGRES_URL: postgresql://source_fixture:source_fixture@localhost:5432/source_fixture
    steps:
      - uses: actions/checkout@v7

      - name: Checkout agentos core (peer dependency)
        uses: actions/checkout@v7
        with:
          repository: framerslab/agentos
          path: packages/agentos
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # pnpm/action-setup runs first; setup-node 6 and later cache pnpm only when asked.
          cache: pnpm

      - name: Resolve published source-store peer floor
        # Pins the @framers/agentos override and the account-sources peer floor to the core checkout's
        # release, or, while npm does not serve it yet (the minutes between a core release commit and its
        # publish), to the newest published release that the committed floor admits, with a notice.
        run: node scripts/resolve-core-release.mjs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build agentos core
        # `--ignore-workspace` is required because the agentos-extensions
        # pnpm-workspace.yaml at the repo root does not list packages/agentos
        # (it's a sibling clone, not a workspace member). Without the flag,
        # pnpm walks up to the root workspace, sees agentos isn't a member,
        # and silently no-ops — leaving packages/agentos/node_modules absent
        # and the build's `rimraf` clean step fails with "command not found".
        run: cd packages/agentos && pnpm install --no-frozen-lockfile --ignore-workspace && pnpm run build

      - name: Build extensions
        run: pnpm run build

      - name: Built account-source cache policy requires permission
        run: |
          node --input-type=module <<'JS'
          import { decideSourceCache } from './registry/curated/research/account-sources/dist/index.js';
          const input = {
            permission: null, maximumCacheMs: 10000, readStartedAt: 1000,
            receivedAt: 1100, windowExpiresAt: 9000,
            headers: { cacheControl: 'max-age=60', date: null, age: null, expires: null },
          };
          if (decideSourceCache(input).kind !== 'skip') throw new Error('permission_bypassed');
          const permitted = { ...input, permission: { evidenceId: 'policy-a', retentionMs: 5000 } };
          const cached = decideSourceCache(permitted);
          if (cached.kind !== 'cache' || cached.expiresAt !== 6000) throw new Error('retention_incorrect');
          const denied = decideSourceCache({ ...permitted, headers: { ...input.headers, cacheControl: 'no-store' } });
          if (denied.kind !== 'skip' || denied.reason !== 'no_store') throw new Error('no_store_bypassed');
          JS

      - name: Built account-source sync contracts retain unresolved work
        run: |
          node --input-type=module <<'JS'
          import {
            createSourceSyncState, transitionSourceSync, openSourceSyncCycle,
            advanceSourceSyncPage, committableSourceCursor,
          } from './registry/curated/research/account-sources/dist/index.js';
          const policy = {
            windowMs: 10000, maxRetainedDocuments: 5, maxHeldCharacters: 1000,
            maxIndexedCharacters: 2000, scanPageSize: 10, maxScanPages: 2, maxCandidates: 20,
            maxChangedPerLease: 10, maxHistoryPagesPerLease: 2, leaseMs: 120000,
            pollMs: 900000, manualMinIntervalMs: 60000, reconcileMs: 86400000,
          };
          const scope = { tenantId: 'tenant-a', ownerId: 'owner-a', connectionId: 'connection-a' };
          const started = transitionSourceSync(createSourceSyncState(scope, 0), { type: 'connect_started' }, 1);
          const ready = transitionSourceSync(started, {
            type: 'grant_ready', use: { searchAskEnabled: true, liveEnabled: false },
          }, 2);
          if (ready.generation !== 1 || ready.status !== 'connected') throw new Error('state_contract_failed');
          const opened = openSourceSyncCycle({
            cycleId: 'cycle-a', generation: 1, mode: 'incremental', cutoff: 100,
            fromCursor: '900719925474099312345678901',
          });
          const { checkpoint } = advanceSourceSyncPage(opened, {
            kind: 'history', ids: ['source-a'], nextPageToken: null,
            cursor: '900719925474099312345678999',
          }, policy);
          const work = {
            cycleId: checkpoint.cycleId, generation: 1, checkpointRevision: checkpoint.revision,
            total: 1, pending: 0, retry: 1, applied: 0, gone: 0, skipped: 0,
          };
          if (committableSourceCursor(checkpoint, work) !== null) throw new Error('retry_committed');
          const complete = { ...work, retry: 0, applied: 1 };
          if (committableSourceCursor(checkpoint, complete) !== '900719925474099312345678999') {
            throw new Error('opaque_cursor_changed');
          }
          JS

      - name: Built source quota exports
        run: |
          node --input-type=module <<'JS'
          import { SourceQuota, sourceQuotaSchema, sourceRetryAt } from './registry/curated/research/account-sources/dist/index.js';
          if (typeof SourceQuota !== 'function' || sourceQuotaSchema('fixture_quota').length !== 7) {
            throw new Error('source_quota_exports_missing');
          }
          if (sourceRetryAt(1000, 1, '172800', 0) !== 172801000) throw new Error('retry_after_shortened');
          JS

      - name: Built source coordinator exports
        run: |
          node --input-type=module <<'JS'
          import {
            AccountSourceSync, SqlAccountSourceSyncStore, sourceSyncCoordinatorSchema,
          } from './registry/curated/research/account-sources/dist/index.js';
          if (typeof AccountSourceSync !== 'function'
            || typeof SqlAccountSourceSyncStore.prototype.reserveOperation !== 'function'
            || typeof SqlAccountSourceSyncStore.prototype.deferOperation !== 'function'
            || typeof SqlAccountSourceSyncStore.prototype.pendingRetry !== 'function') {
            throw new Error('source_coordinator_exports_missing');
          }
          const ddl = sourceSyncCoordinatorSchema('fixture_sync');
          if (ddl.length !== 1 || !ddl[0].includes('ADD COLUMN IF NOT EXISTS operation JSONB')) {
            throw new Error('source_coordinator_schema_missing');
          }
          JS

      - name: Test the release scripts
        # Node 22 takes files or globs here, not a directory to walk.
        run: node --test scripts/__tests__/*.test.mjs

      - name: Test extensions (skip agentos core tests — tested upstream)
        run: pnpm -r --filter '!@framers/agentos' --if-present run test

      - name: Built SQL source exports
        # Runs in the pack's folder: the core resolves from the pack's own dependencies, not from the root.
        working-directory: registry/curated/research/account-sources
        run: |
          node --input-type=module <<'JS'
          import { SqlAccountSourceSyncStore, sourceSyncSchema } from './dist/index.js';
          import { SqlSourceDerivationStore } from '@framers/agentos/cognition/library';
          if (typeof SqlAccountSourceSyncStore !== 'function' || typeof SqlSourceDerivationStore !== 'function') {
            throw new Error('source_store_exports_missing');
          }
          const statements = sourceSyncSchema('fixture_sync');
          if (statements.length !== 6 || statements.some((sql) => sql.includes('?'))) {
            throw new Error('source_schema_contract_failed');
          }
          JS

      - name: Source-store dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-store-dependencies
          path: |
            registry/curated/research/account-sources/package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml

      - name: Pack guard (unpublished versions and packages with a pending changeset)
        run: node scripts/pack-guard.mjs
