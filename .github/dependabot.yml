version: 2
updates:
  # Root dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"

  # NOTE: Per-extension npm entries were removed — the extensions live under
  # registry/curated/<category>/<name>/, not packages/ext-*. The stale
  # /packages/ext-search and /packages/ext-template entries failed every run
  # with "dependency_file_not_found". The root "/" entry above covers the
  # workspace; add a registry/curated/<path> entry here if a specific
  # extension ever needs its own update cadence.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
