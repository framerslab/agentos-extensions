version: 2
updates:
  # Root dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"

  # NOTE: Per-extension npm entries were removed; the extensions live under
  # registry/curated/<category>/<name>/, not packages/ext-*. The stale
  # /packages/ext-search and /packages/ext-template entries failed every run
  # with "dependency_file_not_found". The root "/" entry above covers the
  # workspace; add a registry/curated/<path> entry here if a specific
  # extension ever needs its own update cadence.

  # The document parser's image names its base by a Node release and its
  # digest (registry/curated/tools/document-parser/Dockerfile). This proposes
  # each later Node 22 release's image, its tag and digest together, once the
  # image is three days old, as the lockfile's packages wait three days. A
  # later major Node release is a maintainer's change.
  - package-ecosystem: "docker"
    directory: "/registry/curated/tools/document-parser"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
