packages:
  - "."
  # Every curated extension under registry/curated/<category>/<name>/ ships its
  # own package.json. Without these globs, pnpm sees only the root
  # @framers/agentos-extensions package, so no pack is installed, linked or
  # built as a workspace package (the release plan lists the packages it
  # publishes from scripts/package-roles.json). The two glob depths cover both
  # flat layouts (registry/curated/auth) and category/name layouts
  # (registry/curated/channels/discord).
  - "registry/curated/*"
  - "registry/curated/*/*"
  - "templates/*"
overrides:
  "@framers/agentos": "^0.15.19"
# Dependabot updates pnpm-lock.yaml with pnpm's minimumReleaseAge at 4320
# minutes (three days). The weekly bump moves every @framers pin to the newest
# release, younger than that for days, so pnpm takes this family's releases at
# any age; every other package keeps the three days.
minimumReleaseAgeExclude:
  - "@framers/*"
