packages:
  - "."
  # Every curated extension under registry/curated/<category>/<name>/ ships its
  # own package.json. Without these globs, pnpm + changesets only see the root
  # @framers/agentos-extensions package and the 113 sub-packages never get
  # versioned or published. The two glob depths cover both flat layouts
  # (registry/curated/auth) and category/name layouts (registry/curated/channels/discord).
  - "registry/curated/*"
  - "registry/curated/*/*"
  - "templates/*"
overrides:
  "@framers/agentos": "^0.14.25"
# Dependabot updates pnpm-lock.yaml with pnpm's minimumReleaseAge at 4320
# minutes (three days). The weekly bump moves every @framers pin to the newest
# release, younger than that for days, so pnpm takes this family's releases at
# any age; every other package keeps the three days.
minimumReleaseAgeExclude:
  - "@framers/*"
