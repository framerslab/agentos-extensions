<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fixture</title>
<!--
  The meeting fixture: a page with the adapters' selectors (image/src/adapters/google-meet.ts and microsoft-teams.ts,
  SELECTORS) that moves through the pre-join screen, the waiting room and the call as its server's scripted events
  arrive. The link's platform parameter names the client the page plays, google_meet (the default) or microsoft_teams;
  the other client's elements are removed. Every element an adapter reads has a box, since the adapter reads what is
  visible. The <audio> element plays the known recording into the page's output, which is the call's audio the bot hears.

  The Meet chat is drawn as open-source Meet clients read it in 2026. Its composer takes one of these shapes, chosen by
  the link's chat parameter: a textarea labelled "Send a message" (chat=textarea, the default), the chat of a meeting
  whose history is off; Google Chat's editable as Meet draws it when the chat is a Google Chat conversation
  (chat=history): a div with the textbox role, editable by a bare contenteditable attribute, labelled "History is on";
  that editable under a wrapper that carries the "Send a message to everyone" label, with no role or label of its own
  (chat=nested), the shape one reading of April 2026 found; or a frame the panel embeds (chat=frame, the fixture's
  chat-frame.html at /chat-frame) that holds that editable, its Send key and the messages, with none of them in this
  page, as a Google Chat conversation's panel embeds its frame from chat.google.com. With chat=none the panel holds the
  messages and no composer at all, the shape whose failure carries the panel's outline. With chat=off the panel holds the
  textarea drawn disabled and aria-disabled under another label ("Messages are off in this meeting"), as Meet drew it in
  the nightly check's run of 27 October 2026 for a participant the outline reads as having its chat off (an inference,
  not a Google statement), which no lookup by name reads. With
  chat=aria-disabled the panel holds that textarea under the same label, aria-disabled="true" on itself and no disabled
  attribute: the page still takes text into it, and only the composer's own aria-disabled says it takes none. With
  chat=relabelled the panel holds that textarea enabled, under a label of its own ("Message everyone in the call") that
  no lookup by name reads either: the composer is found by its shape and its place alone, and every later post (the
  farewell among them) goes through it with the panel left open, since the Chat key toggles the panel and marks its
  state in aria-pressed. The panel is an aside, the complementary landmark Meet draws its side panel as. The messages are the items of a
  list labelled "In-call messages", each with data-message-id. A Meet chat event with noId draws its message without
  data-message-id, in the second message shape of the Meet table.

  The Teams page is drawn as the client Microsoft served an anonymous guest on 30 October 2026
  (teams.microsoft.com/light-meetings). The name field is known by its data-tid alone, its id a generated one, and
  Join now stays disabled until a name is typed. As that client read a guest's name on 31 October 2026, the field holds
  50 characters and refuses a name that holds anything but letters, numbers, spaces and - ' . _ @ (the typographic
  apostrophe among them): it marks itself aria-invalid, shows the client's words for the rule in an alert, and keeps
  Join now disabled. The page reports the name Join now took. The lobby is the pre-join screen's place under
  [data-tid="calling-lobby-screen"] with the lobby's words. The call draws no [data-tid="calling-stage"]: its Leave
  key is button#hangup-button, named by its title alone, the People key (button#roster-button) reads "People" while
  the bot is alone and "2 People" with one other person, and the Chat key is button#chat-button. Before the People key
  the call draws a hidden copy of it and an Invite people key, which never stand for its count. A message is an item
  [data-tid="chat-pane-item"] that holds the author's name [data-tid="message-author-name"] and the time beside the
  message's element [data-tid="chat-pane-message"] (the message's id in its own id), whose text is in
  div#content-<id>; the composer is CKEditor's editable, an element inside [data-tid="ckeditor"] (composer=nested, the
  default) or that element itself (composer=self, the shape that client draws). A Teams chat event with noBody draws
  the message's text without div#content-<id>, a message whose body the adapter cannot find. The client the bot image
  was served on 31 October 2026 lays a dialog over the pre-join screen when it finds no microphone or camera, as in the
  bot's browser ("Are you sure you don't want audio or video?"): its backdrop takes every click until its one key,
  Continue without audio or video, is pressed, so the page draws it over the pre-join screen from the start. That
  client draws the bot's own message at once, reading "Sending..." where a message's time goes, until the chat service
  takes it and gives it its time; a message the service refused reads "Failed to send." and reached nobody. With
  dialog=unknown, the dialog over the pre-join screen is one the adapter does not know, its words and its key another
  dialog's, and it covers Join now until the run ends. The page
  refuses the first sendFails messages the bot sends (1 when the link names none) and records a message as posted only
  once it shows its time. With answers, a comma list of take, refuse and hold, the page answers each of the bot's
  messages in turn as the list says, a held message never answered and left reading "Sending...", and takes every
  message past the list's end. An answer of flicker is what that client drew on every message a guest sent that day
  while the meeting's other side read each one once: the message reaches the chat, reads "Failed to send." with its
  retry key from about 100 ms after the send, and shows its time after that. The client's failed state lasted about
  half a second; the page holds it for a second, so a wait that polls the page every few hundred milliseconds sees it.
-->
<style>
  [hidden] { display: none !important; }
  body { font: 14px/1.4 sans-serif; margin: 16px; }
  button, div[role="button"] { display: inline-block; margin: 4px; padding: 6px 10px; border: 1px solid #888; cursor: pointer; }
  #grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  #grid > div { display: flex; align-items: center; justify-content: center; width: 160px; height: 90px; background: #334; color: #fff; }
  #chat { width: 360px; margin-top: 8px; padding: 8px; border: 1px solid #888; }
  #messages > div { margin: 4px 0; }
  textarea { width: 100%; }
  [contenteditable] { min-height: 1.4em; padding: 4px; border: 1px solid #888; }
  #device-dialog .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); z-index: 10; }
  #device-dialog [role="dialog"] { position: fixed; top: 40px; left: 40px; z-index: 11; padding: 16px; background: #fff; border: 1px solid #888; }
</style>
</head>
<body>
  <section id="prejoin">
    <input aria-label="Your name" data-platform="google_meet" />
    <div role="button" aria-label="Turn off camera" data-is-muted="false" data-platform="google_meet">Camera</div>
    <div role="button" aria-label="Turn off microphone" data-is-muted="false" data-platform="google_meet">Microphone</div>
    <button id="ask" data-platform="google_meet">Ask to join</button>
    <input id="field-r7__control" type="text" placeholder="Type your name" maxlength="50" aria-describedby="field-r7__validationMessage" data-tid="prejoin-display-name-input" data-platform="microsoft_teams" />
    <div id="field-r7__validationMessage" role="alert" hidden data-platform="microsoft_teams">Your name can only include letters, numbers, spaces, and these symbols: - ' . _ @</div>
    <button id="prejoin-join-button" type="button" data-tid="prejoin-join-button" aria-label="Join now" disabled data-platform="microsoft_teams">Join now</button>
    <div id="device-dialog" hidden data-platform="microsoft_teams">
      <div class="backdrop" aria-hidden="true"></div>
      <div role="dialog" aria-modal="true" aria-labelledby="device-dialog-words">
        <p id="device-dialog-words">Are you sure you don't want audio or video? If you change your mind, select the camera icon by your address bar and then Always allow.</p>
        <button type="button" id="device-dialog-continue">Continue without audio or video</button>
      </div>
    </div>
  </section>
  <section id="waiting" hidden>
    <p data-platform="google_meet">Asking to join. Someone will let you in soon.</p>
    <div data-tid="calling-lobby-screen" data-platform="microsoft_teams">
      <h1><span data-tid="meeting-header-title" id="lobby-title"></span></h1>
      <button type="button" data-tid="prejoin-cancel-button">Cancel</button>
    </div>
  </section>
  <section id="call" hidden>
    <div id="grid"></div>
    <button aria-label="People" data-platform="google_meet"><div class="count">1</div></button>
    <button type="button" aria-label="People" hidden data-platform="microsoft_teams">People</button>
    <button type="button" aria-label="Invite people" data-platform="microsoft_teams">Invite people</button>
    <button id="roster-button" type="button" aria-label="People" data-platform="microsoft_teams">People</button>
    <button aria-label="Chat with everyone" aria-pressed="false" data-platform="google_meet">Chat</button>
    <button id="chat-button" type="button" aria-label="Chat" aria-pressed="false" data-platform="microsoft_teams">Chat</button>
    <aside id="chat" hidden>
      <div id="messages"></div>
      <textarea aria-label="Send a message" data-platform="google_meet"></textarea>
      <div data-tid="ckeditor" data-platform="microsoft_teams"><div contenteditable="true" role="textbox" aria-label="Type a message"></div></div>
    </aside>
    <button aria-label="Leave call" data-platform="google_meet">Leave</button>
    <button id="hangup-button" type="button" title="Leave" data-platform="microsoft_teams">Leave</button>
    <audio id="audio" src="/recording.wav" loop preload="auto"></audio>
  </section>
  <script>
    const q = new URLSearchParams(location.search);
    const platform = q.get('platform') === 'microsoft_teams' ? 'microsoft_teams' : 'google_meet';
    const teams = platform === 'microsoft_teams';
    for (const element of document.querySelectorAll('[data-platform]')) if (element.dataset.platform !== platform) element.remove();
    const state = { inCall: false, people: Number(q.get('people') ?? 1), name: '', messages: 0 };
    // the time each Teams card shows: one for the whole page, so two cards of the same text read alike but for their element
    const clock = new Date().toTimeString().slice(0, 5);
    const nameInput = document.querySelector(teams ? '[data-tid="prejoin-display-name-input"]' : 'input[aria-label="Your name"]');
    const joinButton = document.querySelector(teams ? 'button[data-tid="prejoin-join-button"]' : '#ask');
    const chat = document.getElementById('chat');
    const chatButton = document.querySelector(teams ? '#chat-button' : 'button[aria-label="Chat with everyone"]');
    const editor = document.querySelector('[data-tid="ckeditor"]');
    if (editor && q.get('composer') === 'self') {
      // the editable is the [data-tid="ckeditor"] element itself
      editor.replaceChildren();
      editor.setAttribute('contenteditable', 'true');
      editor.setAttribute('role', 'textbox');
      editor.setAttribute('aria-label', 'Type a message');
    }
    const textarea = document.querySelector('textarea[aria-label="Send a message"]');
    const chatShape = teams ? 'teams' : (['history', 'nested', 'frame', 'none', 'off', 'aria-disabled', 'relabelled'].includes(q.get('chat')) ? q.get('chat') : 'textarea');
    let input;
    /** The chat panel's frame (chat=frame), and the chat events queued for it until it says it is ready. */
    let frame;
    let frameReady = false;
    const forFrame = [];
    const toFrame = (ev) => {
      if (frameReady) frame.contentWindow.postMessage(ev, location.origin);
      else forFrame.push(ev);
    };
    if (teams) {
      input = editor.isContentEditable ? editor : editor.querySelector('[contenteditable]');
    } else if (chatShape === 'history') {
      // Google Chat's editable as Meet embeds it: a textbox div, editable by a bare contenteditable (which means editable
      // as "true" does), labelled for the chat's history state, with no textarea anywhere in the panel
      input = document.createElement('div');
      input.setAttribute('contenteditable', '');
      input.setAttribute('role', 'textbox');
      input.setAttribute('aria-multiline', 'true');
      input.setAttribute('aria-label', 'History is on');
      textarea.replaceWith(input);
    } else if (chatShape === 'nested') {
      // the editable under a wrapper that carries the label; the editable itself has no role and no label
      const wrapper = document.createElement('div');
      wrapper.setAttribute('aria-label', 'Send a message to everyone');
      input = document.createElement('div');
      input.setAttribute('contenteditable', 'true');
      wrapper.appendChild(input);
      textarea.replaceWith(wrapper);
    } else if (chatShape === 'frame') {
      // a Google Chat conversation's panel: the composer, its Send key and the messages inside a frame the panel embeds,
      // served from the fixture's own origin; the page's own list and textarea go
      frame = document.createElement('iframe');
      frame.setAttribute('src', '/chat-frame');
      frame.setAttribute('title', 'Chat');
      frame.style.width = '100%';
      frame.style.height = '240px';
      frame.style.border = '0';
      document.getElementById('messages').remove();
      textarea.replaceWith(frame);
      window.addEventListener('message', (e) => {
        if (e.origin !== location.origin || e.data?.type !== 'ready') return;
        frameReady = true;
        for (const ev of forFrame.splice(0)) frame.contentWindow.postMessage(ev, location.origin);
      });
    } else if (chatShape === 'none') {
      // a panel with no composer the adapter knows: the messages alone
      textarea.remove();
    } else if (chatShape === 'off') {
      // the composer drawn disabled, as Meet drew it on 27 October 2026 for a participant the outline reads as having
      // its chat off: the disabled attribute,
      // aria-disabled, and a label that begins neither "Send a message" nor "History is o"
      textarea.setAttribute('disabled', '');
      textarea.setAttribute('aria-disabled', 'true');
      textarea.setAttribute('aria-label', 'Messages are off in this meeting');
      input = textarea;
    } else if (chatShape === 'aria-disabled') {
      // the composer marked aria-disabled="true" on itself alone, under the label chat=off draws, with no disabled
      // attribute: the page still takes text into it and sends it on Enter, so a post that went through is recorded
      textarea.setAttribute('aria-disabled', 'true');
      textarea.setAttribute('aria-label', 'Messages are off in this meeting');
      input = textarea;
    } else if (chatShape === 'relabelled') {
      // the composer enabled, under a label that begins neither "Send a message" nor "History is o": read by its shape
      // and its place in the panel alone, on the notice and on every post after it
      textarea.setAttribute('aria-label', 'Message everyone in the call');
      input = textarea;
    } else {
      input = textarea;
    }
    if (!teams && chatShape !== 'frame') {
      // the Meet panel's messages: the items of a list named for the call's messages
      const list = document.getElementById('messages');
      list.setAttribute('role', 'list');
      list.setAttribute('aria-label', 'In-call messages');
    }
    const audio = document.getElementById('audio');
    const show = (id) => { for (const s of ['prejoin', 'waiting', 'call']) document.getElementById(s).hidden = s !== id; };
    // what the page did, for the test to read on the server's GET /state; keepalive so a closing browser still sends it
    const report = (path, body) => fetch(path, { method: 'POST', body, keepalive: true }).catch(() => {});
    // the call grid: the bot's own tile, named as it typed its name, and one tile per other participant
    const tiles = () => {
      const grid = document.getElementById('grid');
      grid.replaceChildren();
      const self = document.createElement('div');
      self.dataset.selfName = state.name || 'You';
      self.textContent = state.name || 'You';
      grid.appendChild(self);
      for (let i = 1; i <= state.people; i++) {
        const tile = document.createElement('div');
        tile.dataset.participantId = `p${i}`;
        tile.textContent = `Participant ${i}`;
        grid.appendChild(tile);
      }
    };
    // the client's count holds the bot as well as the others; the Teams People key draws no number while the bot is alone
    const people = () => {
      const all = state.people + 1;
      if (teams) document.getElementById('roster-button').textContent = all > 1 ? `${all} People` : 'People';
      else document.querySelector('button[aria-label="People"] div.count').textContent = String(all);
    };
    const setChat = (open) => { chat.hidden = !open; chatButton.setAttribute('aria-pressed', String(open)); };
    const sentTime = (mid) => {
      const time = document.createElement('time');
      time.id = `timestamp-${mid}`;
      time.textContent = clock;
      return time;
    };
    // the chat service's answer to each of the bot's messages in turn: the answers list's (take, refuse or hold, then
    // take past its end) when the link has one, else the first sendFails refused and the rest taken
    const answers = q.get('answers')?.split(',') ?? [];
    let refusals = Number(q.get('sendFails') ?? 1);
    let botSends = 0;
    const answerTo = () => {
      botSends += 1;
      if (answers.length) return answers[botSends - 1] ?? 'take';
      if (refusals > 0) {
        refusals -= 1;
        return 'refuse';
      }
      return 'take';
    };
    // the answer drawn: refused, the message reads "Failed to send." and reaches nobody; taken, it shows its time and is
    // recorded as posted; held, it is never answered and keeps reading "Sending..."
    const settle = (item, text, answer) => {
      if (answer === 'hold') return;
      const when = item.querySelector('[data-tid="message-sending-title"]');
      if (answer === 'flicker') {
        // taken, and drawn failed for a moment before its time
        report('/posted', text);
        const failed = document.createElement('span');
        failed.dataset.tid = 'message-send-failed-title';
        failed.textContent = 'Failed to send.';
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.dataset.tid = 'message-failed-retry';
        retry.textContent = 'Retry';
        when.replaceWith(failed, retry);
        setTimeout(() => {
          retry.remove();
          failed.replaceWith(sentTime(item.querySelector('[data-tid="chat-pane-message"]').dataset.mid));
        }, 1_000);
        return;
      }
      if (answer === 'refuse') {
        when.textContent = 'Failed to send.';
        return;
      }
      when.replaceWith(sentTime(item.querySelector('[data-tid="chat-pane-message"]').dataset.mid));
      report('/posted', text);
    };
    const addMessage = (sender, text, noId, noBody, status = 'sent') => {
      if (frame) {
        toFrame({ type: 'chat', sender, text, noId: noId === true }); // the frame draws the panel's messages
        return;
      }
      const message = document.createElement('div');
      if (teams) {
        // the item holds the author's name and the time beside the message's element, which carries the message's id
        state.messages += 1;
        const mid = String(1793342250700 + state.messages);
        const item = document.createElement('div');
        item.dataset.tid = 'chat-pane-item';
        const wrapper = document.createElement('div');
        wrapper.dataset.testid = 'message-wrapper';
        const heading = document.createElement('div');
        heading.setAttribute('role', 'heading');
        heading.setAttribute('aria-level', '4');
        heading.textContent = `${text} by ${sender}`;
        const meta = document.createElement('div');
        const author = document.createElement('span');
        author.id = `author-${mid}`;
        author.dataset.tid = 'message-author-name';
        author.textContent = sender;
        // a message the chat service took shows its time; the bot's own message reads "Sending..." there until then
        const when = document.createElement('span');
        when.dataset.tid = 'message-sending-title';
        when.textContent = 'Sending...';
        meta.append(status === 'sent' ? sentTime(mid) : when, author);
        message.id = `message-body-${mid}`;
        message.dataset.tid = 'chat-pane-message';
        message.dataset.mid = mid;
        message.setAttribute('role', 'group');
        const actions = document.createElement('button');
        actions.type = 'button';
        actions.dataset.tid = 'message-actions-menu-hidden-button';
        actions.setAttribute('aria-label', 'More message options');
        const content = document.createElement('div');
        if (!noBody) {
          content.id = `content-${mid}`;
          content.setAttribute('aria-label', text);
        }
        const paragraph = document.createElement('p');
        paragraph.textContent = text;
        content.append(paragraph);
        message.append(actions, content);
        wrapper.append(heading, meta, message);
        item.append(wrapper);
        document.getElementById('messages').appendChild(item);
        return item;
      } else {
        state.messages += 1;
        message.setAttribute('role', 'listitem');
        if (noId) {
          message.setAttribute('jsname', `m${state.messages}`);
          message.dataset.senderName = sender;
        } else {
          message.dataset.messageId = `m${state.messages}`;
        }
        const who = document.createElement('div');
        who.dataset.senderName = sender;
        who.textContent = sender;
        const body = document.createElement('div');
        body.setAttribute('data-message-text', '');
        body.textContent = text;
        message.append(who, body);
      }
      document.getElementById('messages').appendChild(message);
    };
    for (const toggle of document.querySelectorAll('#prejoin [data-is-muted]')) {
      toggle.onclick = () => { toggle.dataset.isMuted = toggle.dataset.isMuted === 'false' ? 'true' : 'false'; };
    }
    // Teams keeps Join now disabled until a name is typed, and while the name holds a character its rule refuses; its
    // lobby greets the name
    const nameRule = /^[\p{L}\p{M}\p{N} '\u2019._@-]*$/u;
    if (teams) {
      const ruleWords = document.getElementById('field-r7__validationMessage');
      nameInput.addEventListener('input', () => {
        const refused = !nameRule.test(nameInput.value);
        if (refused) nameInput.setAttribute('aria-invalid', 'true');
        else nameInput.removeAttribute('aria-invalid');
        ruleWords.hidden = !refused;
        joinButton.disabled = refused || !nameInput.value.trim();
      });
    }
    // the device dialog over the Teams pre-join screen, as the client draws it for a browser with no microphone or camera
    const deviceDialog = document.getElementById('device-dialog');
    if (deviceDialog) {
      deviceDialog.hidden = false;
      // dialog=unknown: a dialog in its place whose words and key the adapter does not know
      if (q.get('dialog') === 'unknown') {
        document.getElementById('device-dialog-words').textContent = "The meeting's organizer asks you to read the meeting's rules first.";
        document.getElementById('device-dialog-continue').textContent = 'Read the rules';
      }
      document.getElementById('device-dialog-continue').onclick = () => { deviceDialog.hidden = true; };
    }
    joinButton.onclick = () => {
      state.name = nameInput.value;
      if (teams) document.getElementById('lobby-title').textContent = `Hi, ${state.name}. Someone will let you in when the meeting starts.`;
      show('waiting');
      report('/joined', state.name);
    };
    chatButton.onclick = () => setChat(chat.hidden);
    // the frame's composer sends and reports on its own, and the none shape has no composer
    if (input) {
      input.onkeydown = (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        // an editable holds its text as content, a textarea as its value; both send on Enter and empty
        const editable = input.isContentEditable;
        const text = editable ? input.textContent : input.value;
        if (editable) input.textContent = '';
        else input.value = '';
        if (!text.trim()) return;
        // the bot's own message: Meet names its sender You, the Teams card the name the bot typed, held as "Sending..."
        // until the chat service answers
        if (teams) {
          const item = addMessage(state.name, text, false, false, 'sending');
          const answer = answerTo();
          setTimeout(() => settle(item, text, answer), answer === 'flicker' ? 100 : 300);
          return;
        }
        addMessage('You', text, false);
        report('/posted', text);
      };
    }
    document.querySelector(teams ? '#hangup-button' : 'button[aria-label="Leave call"]').onclick = () => { state.inCall = false; audio.pause(); show('prejoin'); report('/left'); };
    const apply = (ev) => {
      if (ev.type === 'admit' && !state.inCall) { state.inCall = true; show('call'); tiles(); people(); audio.play().catch(() => {}); }
      if (ev.type === 'late_joiner') { state.people += 1; tiles(); people(); if (frame) toFrame({ type: 'clear' }); else document.getElementById('messages').replaceChildren(); /* Meet shows a late joiner no history */ }
      if (ev.type === 'chat') addMessage(ev.sender ?? 'Sam', String(ev.text ?? ''), ev.noId === true, ev.noBody === true);
      if (ev.type === 'leave_all') { state.people = 0; tiles(); people(); }
      if (ev.type === 'hide_chat') setChat(false);
      if (ev.type === 'show_chat') setChat(true);
    };
    const poll = async () => {
      try {
        const events = await (await fetch('/events', { cache: 'no-store' })).json();
        for (const ev of events) apply(ev);
      } catch {
        // the server restarting or the page closing: the next poll tries again
      }
      setTimeout(poll, 500);
    };
    poll();
  </script>
</body>
</html>
