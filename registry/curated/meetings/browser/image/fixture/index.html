<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fixture</title>
<!--
  The meeting fixture: a page with the adapters' selectors (image/src/adapters/google-meet.ts and microsoft-teams.ts,
  SELECTORS) that moves through the pre-join screen, the waiting room and the call as its server's scripted events
  arrive. The link's platform parameter names the client the page plays, google_meet (the default) or microsoft_teams;
  the other client's elements are removed. Every element an adapter reads has a box, since the adapter reads what is
  visible. The <audio> element plays the known recording into the page's output, which is the call's audio the bot hears.

  The Teams chat is drawn as open-source Teams clients read it: a message card [data-tid="chat-pane-message"] holds its
  author [data-tid="message-author-name"], its time and its body [data-tid="messageBodyContent"]; the composer is
  CKEditor's editable, an element inside [data-tid="ckeditor"] (composer=nested, the default) or that element itself
  (composer=self), the two shapes Teams builds show. A Meet chat event with noId draws its message without
  data-message-id, in the second message shape of the Meet table.
-->
<style>
  [hidden] { display: none !important; }
  body { font: 14px/1.4 sans-serif; margin: 16px; }
  button, div[role="button"] { display: inline-block; margin: 4px; padding: 6px 10px; border: 1px solid #888; cursor: pointer; }
  #grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  #grid > div { display: flex; align-items: center; justify-content: center; width: 160px; height: 90px; background: #334; color: #fff; }
  #chat { width: 360px; margin-top: 8px; padding: 8px; border: 1px solid #888; }
  #messages > div { margin: 4px 0; }
  textarea { width: 100%; }
  [contenteditable] { min-height: 1.4em; padding: 4px; border: 1px solid #888; }
</style>
</head>
<body>
  <section id="prejoin">
    <input aria-label="Your name" data-platform="google_meet" />
    <div role="button" aria-label="Turn off camera" data-is-muted="false" data-platform="google_meet">Camera</div>
    <div role="button" aria-label="Turn off microphone" data-is-muted="false" data-platform="google_meet">Microphone</div>
    <button id="ask" data-platform="google_meet">Ask to join</button>
    <input id="prejoin-display-name-input" data-platform="microsoft_teams" />
    <button data-tid="prejoin-join-button" data-platform="microsoft_teams">Join now</button>
  </section>
  <section id="waiting" hidden>
    <p data-platform="google_meet">Asking to join. Someone will let you in soon.</p>
    <p data-platform="microsoft_teams">Someone in the meeting should let you in soon.</p>
  </section>
  <section id="call" data-tid="calling-stage" hidden>
    <div id="grid"></div>
    <button aria-label="People"><div class="count">1</div></button>
    <button aria-label="Chat with everyone" aria-pressed="false">Chat</button>
    <div id="chat" hidden>
      <div id="messages"></div>
      <textarea aria-label="Send a message" data-platform="google_meet"></textarea>
      <div data-tid="ckeditor" data-platform="microsoft_teams"><div contenteditable="true" role="textbox" aria-label="Type a message"></div></div>
    </div>
    <button aria-label="Leave call">Leave</button>
    <audio id="audio" src="/recording.wav" loop preload="auto"></audio>
  </section>
  <script>
    const q = new URLSearchParams(location.search);
    const platform = q.get('platform') === 'microsoft_teams' ? 'microsoft_teams' : 'google_meet';
    const teams = platform === 'microsoft_teams';
    for (const element of document.querySelectorAll('[data-platform]')) if (element.dataset.platform !== platform) element.remove();
    const state = { inCall: false, people: Number(q.get('people') ?? 1), name: '', messages: 0 };
    // the time each Teams card shows: one for the whole page, so two cards of the same text read alike but for their element
    const clock = new Date().toTimeString().slice(0, 5);
    const nameInput = document.querySelector(teams ? '#prejoin-display-name-input' : 'input[aria-label="Your name"]');
    const joinButton = document.querySelector(teams ? 'button[data-tid="prejoin-join-button"]' : '#ask');
    const chat = document.getElementById('chat');
    const chatButton = document.querySelector('button[aria-label="Chat with everyone"]');
    const editor = document.querySelector('[data-tid="ckeditor"]');
    if (editor && q.get('composer') === 'self') {
      // the editable is the [data-tid="ckeditor"] element itself
      editor.replaceChildren();
      editor.setAttribute('contenteditable', 'true');
      editor.setAttribute('role', 'textbox');
      editor.setAttribute('aria-label', 'Type a message');
    }
    const input = teams ? (editor.isContentEditable ? editor : editor.querySelector('[contenteditable]')) : document.querySelector('textarea[aria-label="Send a message"]');
    const audio = document.getElementById('audio');
    const show = (id) => { for (const s of ['prejoin', 'waiting', 'call']) document.getElementById(s).hidden = s !== id; };
    // what the page did, for the test to read on the server's GET /state; keepalive so a closing browser still sends it
    const report = (path, body) => fetch(path, { method: 'POST', body, keepalive: true }).catch(() => {});
    // the call grid: the bot's own tile, named as it typed its name, and one tile per other participant
    const tiles = () => {
      const grid = document.getElementById('grid');
      grid.replaceChildren();
      const self = document.createElement('div');
      self.dataset.selfName = state.name || 'You';
      self.textContent = state.name || 'You';
      grid.appendChild(self);
      for (let i = 1; i <= state.people; i++) {
        const tile = document.createElement('div');
        tile.dataset.participantId = `p${i}`;
        tile.textContent = `Participant ${i}`;
        grid.appendChild(tile);
      }
    };
    // the client's count holds the bot as well as the others
    const people = () => { document.querySelector('button[aria-label="People"] div.count').textContent = String(state.people + 1); };
    const setChat = (open) => { chat.hidden = !open; chatButton.setAttribute('aria-pressed', String(open)); };
    const addMessage = (sender, text, noId) => {
      const message = document.createElement('div');
      if (teams) {
        message.dataset.tid = 'chat-pane-message';
        const author = document.createElement('div');
        author.dataset.tid = 'message-author-name';
        author.textContent = sender;
        const time = document.createElement('span');
        time.textContent = clock;
        const body = document.createElement('div');
        body.dataset.tid = 'messageBodyContent';
        body.textContent = text;
        message.append(author, time, body);
      } else {
        state.messages += 1;
        if (noId) {
          message.setAttribute('jsname', `m${state.messages}`);
          message.dataset.senderName = sender;
        } else {
          message.dataset.messageId = `m${state.messages}`;
        }
        const who = document.createElement('div');
        who.dataset.senderName = sender;
        who.textContent = sender;
        const body = document.createElement('div');
        body.setAttribute('data-message-text', '');
        body.textContent = text;
        message.append(who, body);
      }
      document.getElementById('messages').appendChild(message);
    };
    for (const toggle of document.querySelectorAll('#prejoin [data-is-muted]')) {
      toggle.onclick = () => { toggle.dataset.isMuted = toggle.dataset.isMuted === 'false' ? 'true' : 'false'; };
    }
    joinButton.onclick = () => { state.name = nameInput.value; show('waiting'); report('/joined'); };
    chatButton.onclick = () => setChat(chat.hidden);
    input.onkeydown = (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const text = teams ? input.textContent : input.value;
      if (teams) input.textContent = '';
      else input.value = '';
      if (!text.trim()) return;
      // the bot's own message: Meet names its sender You, the Teams card the name the bot typed
      addMessage(teams ? state.name : 'You', text, false);
      report('/posted', text);
    };
    document.querySelector('button[aria-label="Leave call"]').onclick = () => { state.inCall = false; audio.pause(); show('prejoin'); report('/left'); };
    const apply = (ev) => {
      if (ev.type === 'admit' && !state.inCall) { state.inCall = true; show('call'); tiles(); people(); audio.play().catch(() => {}); }
      if (ev.type === 'late_joiner') { state.people += 1; tiles(); people(); document.getElementById('messages').replaceChildren(); /* Meet shows a late joiner no history */ }
      if (ev.type === 'chat') addMessage(ev.sender ?? 'Sam', String(ev.text ?? ''), ev.noId === true);
      if (ev.type === 'leave_all') { state.people = 0; tiles(); people(); }
      if (ev.type === 'hide_chat') setChat(false);
      if (ev.type === 'show_chat') setChat(true);
    };
    const poll = async () => {
      try {
        const events = await (await fetch('/events', { cache: 'no-store' })).json();
        for (const ev of events) apply(ev);
      } catch {
        // the server restarting or the page closing: the next poll tries again
      }
      setTimeout(poll, 500);
    };
    poll();
  </script>
</body>
</html>
